<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>交流天地管理 · GlobalYouXuan</title><link rel="stylesheet" href="site.css"><style>body{margin:0;background:#f4f8ff;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:760px;margin:auto;padding:16px 14px 80px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.top h1{margin:0;font-size:22px}.back{display:inline-flex;text-decoration:none;border:1px solid #dce4ef;background:#fff;color:#1767e8;border-radius:11px;padding:9px 12px;font-weight:800}.card{background:#fff;border:1px solid #dfe6ef;border-radius:18px;padding:14px;margin-bottom:12px}.card h2{margin:0 0 8px;font-size:17px}.muted{color:#667085;font-size:12px;line-height:1.6}.add{display:flex;gap:8px;margin-top:10px}.add input{flex:1;min-width:0;border:1px solid #d9e1ec;border-radius:11px;padding:11px;font:inherit}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:850}.primary{background:#1767e8;color:#fff}.danger{background:#fff0ee;color:#b42318}.term{display:flex;align-items:center;gap:9px;padding:11px 0;border-bottom:1px solid #edf0f4}.term:last-child{border-bottom:0}.term strong{flex:1;word-break:break-all}.switch{border:0;border-radius:999px;padding:7px 10px;font-weight:800}.on{background:#eaf7ef;color:#14804a}.off{background:#f2f4f7;color:#667085}.empty{text-align:center;color:#98a2b3;padding:24px}.rule{display:grid;gap:8px}.rule div{padding:10px;border-radius:11px;background:#f8fbff;font-size:13px}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#101828;color:#fff;padding:10px 14px;border-radius:11px;font-size:13px;z-index:99}</style></head><body><main class="wrap"><header class="top"><div><h1>交流天地管理</h1><div class="muted">敏感词与发言规则</div></div><a class="back" href="admin.html">返回后台</a></header><section class="card"><h2>固定规则</h2><div class="rule"><div>🔗 会员禁止发送网址和外部链接</div><div>🛡️ 动态、评论、私聊消息统一走数据库过滤</div><div>👤 只有管理员可以管理敏感词</div></div></section><section class="card"><h2>新增敏感词</h2><div class="muted">输入一个词或短语，保存后立即生效。</div><div class="add"><input id="newTerm" maxlength="80" placeholder="例如：私下交易"><button id="addBtn" class="btn primary">添加</button></div></section><section class="card"><h2>敏感词列表</h2><div id="list" class="empty">正在读取…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.0/dist/umd/supabase.js"></script><script src="supabase-client.js"></script><script>const $=s=>document.querySelector(s);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}async function guard(){const {data}=await window.gyxSupabase.auth.getSession();const u=data.session?.user;if(!u){location.replace('admin-login.html');return null}const {data:a,error}=await window.gyxSupabase.from('admin_users').select('user_id,is_active').eq('user_id',u.id).maybeSingle();if(error||!a?.is_active){alert('当前账号没有管理员权限');location.replace('admin-login.html');return null}return u}async function load(){const box=$('#list');const {data,error}=await window.gyxSupabase.from('community_blocked_terms').select('id,term,is_active,created_at').order('id');if(error){box.innerHTML='<div class="empty">读取失败：'+esc(error.message)+'</div>';return}if(!data?.length){box.innerHTML='<div class="empty">暂时没有敏感词</div>';return}box.innerHTML=data.map(x=>`<div class="term"><strong>${esc(x.term)}</strong><button class="switch ${x.is_active?'on':'off'}" data-toggle="${x.id}" data-state="${x.is_active}">${x.is_active?'已启用':'已停用'}</button><button class="btn danger" data-del="${x.id}">删除</button></div>`).join('');box.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{const id=Number(b.dataset.toggle),next=b.dataset.state!=='true';const {error}=await window.gyxSupabase.from('community_blocked_terms').update({is_active:next}).eq('id',id);if(error)return toast('修改失败');toast(next?'已启用':'已停用');load()});box.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('确定删除这个敏感词？'))return;const {error}=await window.gyxSupabase.from('community_blocked_terms').delete().eq('id',Number(b.dataset.del));if(error)return toast('删除失败');toast('已删除');load()})}$('#addBtn').onclick=async()=>{const input=$('#newTerm'),term=input.value.trim();if(!term)return;if(/https?:\/\/|www\.|\.[a-z]{2,8}(?:\/|\s|$)/i.test(term))return toast('网址由系统固定拦截，无需加入敏感词');const {error}=await window.gyxSupabase.from('community_blocked_terms').insert({term,is_active:true});if(error)return toast(error.code==='23505'?'这个词已经存在':'添加失败');input.value='';toast('已添加并生效');load()};(async()=>{if(await guard())load()})();</script></body></html>
