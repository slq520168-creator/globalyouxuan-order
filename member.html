<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#06101d">
  <meta name="robots" content="noindex">
  <title>我的会员中心｜全球优选</title>
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="shop.html">
        <span class="brand-mark">GY</span>
        <span data-i18n="brand">全球优选</span>
      </a>
      <nav class="nav" aria-label="Main navigation">
        <a href="shop.html" data-i18n="navShop">方案中心</a>
        <a href="knowledge.html" data-i18n="navKnowledge">问答资料库</a>
        <a href="member.html" aria-current="page" data-i18n="navMember">会员中心</a>
      </nav>
      <div class="header-actions">
        <select class="language-select" data-language-select aria-label="Language">
          <option value="zh-CN">中文</option>
          <option value="en">English</option>
          <option value="km">ខ្មែរ</option>
        </select>
        <button id="logoutButton" class="btn btn-secondary" type="button" data-i18n="logout">退出登录</button>
      </div>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="shell">
        <p class="eyebrow" data-i18n="brand">全球优选</p>
        <h1 class="gradient-text" data-i18n="memberTitle">我的会员中心</h1>
        <p data-i18n="memberLead">只显示当前账号自己的资料、订单和私人资料库。</p>
      </div>
    </section>

    <div class="shell dashboard-grid">
      <aside class="panel profile-card">
        <div class="avatar" id="profileAvatar">GY</div>
        <h2 class="profile-name" id="profileHeading">—</h2>
        <p class="profile-email" id="profileEmail">—</p>
        <div class="profile-meta">
          <div class="meta-row"><span data-i18n="memberId">会员编号</span><strong id="profileUserId">—</strong></div>
          <div class="meta-row"><span data-i18n="joinedAt">注册时间</span><strong id="profileJoinedAt">—</strong></div>
        </div>

        <form id="profileForm" class="form-stack">
          <h2 data-i18n="profileTitle">会员资料</h2>
          <div class="form-group">
            <label for="profileName" data-i18n="displayName">会员名称</label>
            <input id="profileName" class="field" type="text" maxlength="80" autocomplete="name"
              data-i18n-placeholder="displayNamePlaceholder" placeholder="请输入会员名称">
          </div>
          <div class="form-group">
            <label for="profilePhone" data-i18n="phone">电话</label>
            <input id="profilePhone" class="field" type="tel" maxlength="40" autocomplete="tel"
              data-i18n-placeholder="phonePlaceholder" placeholder="请输入联系电话">
          </div>
          <div class="form-group">
            <label for="profileLocale" data-i18n="profileLanguage">默认语言</label>
            <select id="profileLocale" class="select">
              <option value="zh-CN">中文</option>
              <option value="en">English</option>
              <option value="km">ខ្មែរ</option>
            </select>
          </div>
          <div id="profileMessage" class="form-message" aria-live="polite"></div>
          <button id="saveProfileButton" class="btn btn-block" type="submit" data-i18n="saveProfile">保存会员资料</button>
        </form>
      </aside>

      <div class="dashboard-main">
        <section id="orders" class="panel">
          <div class="panel-head">
            <h2 data-i18n="ordersTitle">我的订单</h2>
            <button id="refreshOrdersButton" class="btn btn-secondary btn-small" type="button" data-i18n="refresh">刷新</button>
          </div>
          <div id="ordersMessage" class="form-message" aria-live="polite"></div>
          <div id="orderList" class="order-list">
            <div class="loading-card" data-i18n="loading">正在读取数据库…</div>
          </div>
        </section>

        <section id="materials" class="panel">
          <div class="panel-head">
            <div>
              <h2 data-i18n="materialsTitle">我的资料库</h2>
              <p class="muted" data-i18n="materialsLead">把还没入库的长资料粘贴到这里；它只对你的账号可见，也会加入你的问答搜索。</p>
            </div>
            <button id="newMaterialButton" class="btn btn-secondary btn-small" type="button" data-i18n="newMaterial">新增资料</button>
          </div>

          <form id="materialForm" class="material-form form-stack">
            <div class="form-row">
              <div class="form-group">
                <label for="materialTitle" data-i18n="materialTitle">资料标题</label>
                <input id="materialTitle" class="field" type="text" minlength="2" maxlength="160"
                  data-i18n-placeholder="materialTitlePlaceholder" placeholder="例如：短视频脚本模板" required>
              </div>
              <div class="form-group">
                <label for="materialSource" data-i18n="sourceName">来源/文件名（选填）</label>
                <input id="materialSource" class="field" type="text" maxlength="200"
                  data-i18n-placeholder="sourcePlaceholder" placeholder="例如：我的营销笔记.docx">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="materialCategory" data-i18n="category">分类</label>
                <select id="materialCategory" class="select">
                  <option value="work" data-i18n="catWork">AI 办公</option>
                  <option value="creation" data-i18n="catCreation">AI 创作</option>
                  <option value="business" data-i18n="catBusiness">AI 商业</option>
                  <option value="automation" data-i18n="catAutomation">AI 自动化</option>
                  <option value="other" data-i18n="all">全部</option>
                </select>
              </div>
              <div class="form-group">
                <label for="materialLanguage" data-i18n="materialLanguage">资料语言</label>
                <select id="materialLanguage" class="select">
                  <option value="zh-CN">中文</option>
                  <option value="en">English</option>
                  <option value="km">ខ្មែរ</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label for="materialContent" data-i18n="materialContent">资料正文</label>
              <textarea id="materialContent" class="textarea" minlength="10" maxlength="50000"
                data-i18n-placeholder="materialContentPlaceholder" placeholder="粘贴完整正文，最多 50,000 字符" required></textarea>
              <span id="materialLength" class="form-help">0 / 50,000</span>
            </div>
            <div id="materialMessage" class="form-message" aria-live="polite"></div>
            <button id="saveMaterialButton" class="btn" type="submit" data-i18n="saveMaterial">保存到数据库</button>
          </form>

          <div class="toolbar">
            <input id="materialSearch" class="field" type="search" maxlength="160"
              data-i18n-placeholder="search" placeholder="搜索资料">
            <a class="btn btn-secondary" href="knowledge.html?filter=mine" data-i18n="navKnowledge">问答资料库</a>
          </div>
          <div id="materialList" class="material-list" style="margin-top:14px">
            <div class="loading-card" data-i18n="loading">正在读取数据库…</div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <footer class="site-footer"><div class="shell" data-i18n="footer">全球优选 · 安全会员与数字交付</div></footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.0/dist/umd/supabase.js"></script>
  <script src="supabase-client.js"></script>
  <script src="i18n.js"></script>
  <script src="member.js"></script>
</body>
</html>
