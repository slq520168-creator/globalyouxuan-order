<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f4f8ff">
<meta name="robots" content="noindex">
<title>GlobalYouXuan</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('gyx_theme')==='dark'?'dark':'light'}catch{document.documentElement.dataset.theme='light'}</script>
<link rel="stylesheet" href="site.css">
<style>
.cs{max-width:760px;margin:auto;padding:8px 10px 86px}.top{text-align:center;margin-bottom:5px}.top h1{font-size:22px;line-height:1.15;margin:0;font-weight:950}.top .date{display:block;margin-top:2px;font-size:12px;font-weight:800;color:#1478ff}.notice{margin:4px 0 6px;padding:6px 8px;border-radius:9px;background:rgba(255,170,0,.10);color:#9a6500;font-size:10px;line-height:1.35;text-align:center;font-weight:750}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:0 0 6px}.stat{border:1px solid var(--border,#dfe6ef);background:var(--card,#fff);border-radius:10px;text-align:center;padding:5px 2px}.stat b{display:block;font-size:15px;line-height:1.05}.stat span{font-size:9px;color:var(--muted,#667085)}.ticker,.feed{border:1px solid var(--border,#dfe6ef);background:var(--card,#fff);border-radius:12px;overflow:hidden}.ticker{padding:4px 9px;margin-bottom:6px}.ticker-head{display:flex;justify-content:flex-start;align-items:center;height:24px;font-size:10px}.ticker-head b{font-size:12px}.ticker-window{height:125px;overflow:hidden}.ticker-track{transition:transform .4s ease}.tick{height:25px;display:flex;align-items:center;gap:6px;border-top:1px solid var(--border,#edf1f6);font-size:11px}.tick i{width:5px;height:5px;border-radius:50%;background:#19a974;flex:0 0 auto}.tick b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.batchbar{display:flex;align-items:center;justify-content:space-between;height:30px;margin-top:1px}.tabs{display:flex;gap:5px}.tab{border:1px solid var(--border,#dfe6ef);background:var(--card,#fff);color:inherit;border-radius:8px;height:24px;padding:0 10px;font-size:10px;font-weight:900}.tab.active{background:#1478ff;color:#fff;border-color:#1478ff}.batchbar small{font-size:9px;color:var(--muted,#667085)}.feed{display:block}.row{height:29px;display:grid;grid-template-columns:30px minmax(0,1fr) 44px;align-items:center;gap:3px;padding:0 6px;border-bottom:1px solid var(--border,#edf1f6);font-size:10px}.row:last-child{border-bottom:0}.num{font-weight:950;color:#1478ff;text-align:center}.title{min-width:0;font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.take{display:inline-flex;align-items:center;justify-content:center;height:21px;border-radius:6px;text-decoration:none;font-size:9px;font-weight:850;white-space:nowrap;border:0;background:#f59e0b;color:#fff}.row.closed{background:rgba(148,163,184,.12);color:#98a2b3}.row.closed .num,.row.closed .title{color:#98a2b3}.row.closed .take{background:#98a2b3;color:#fff;pointer-events:none}.empty{text-align:center;padding:28px 10px;color:var(--muted,#667085);font-size:12px}.redeem-mask{position:fixed;inset:0;z-index:350000;background:rgba(0,0,0,.48);display:flex;align-items:center;justify-content:center;padding:18px}.redeem-mask[hidden]{display:none}.redeem-card{width:min(100%,360px);background:var(--card,#fff);color:var(--text,#172033);border-radius:18px;padding:20px;box-shadow:0 24px 70px rgba(0,0,0,.28);text-align:center}.redeem-card h3{margin:0 0 8px;font-size:21px}.redeem-card p{margin:7px 0;line-height:1.55}.redeem-cost{font-size:27px;font-weight:950;color:#f59e0b}.redeem-note{font-size:13px;color:var(--muted,#667085)}.redeem-short{font-weight:900;color:#dc2626}.redeem-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}.redeem-actions button,.redeem-actions a{min-height:46px;border:0;border-radius:12px;font-weight:900;text-decoration:none;display:flex;align-items:center;justify-content:center}.redeem-cancel{background:#eef2f6;color:#344054}.redeem-confirm,.redeem-downloads{background:#f59e0b;color:white}.redeem-confirm:disabled{opacity:.45}.redeem-success{font-size:16px;font-weight:900;color:#12835c}@media(min-width:700px){.cs{max-width:900px}.feed{display:grid;grid-template-columns:1fr 1fr}.row:nth-child(odd){border-right:1px solid var(--border,#edf1f6)}.row:nth-last-child(-n+2){border-bottom:0}}html[lang="km"] .notice{font-size:9px}html[lang="km"] .stat span,html[lang="km"] .batchbar small{font-size:8px}
</style>
</head>
<body>
<main class="cs"><div class="top"><h1 id="pageTitle" data-i18n="communityTitle"></h1><span id="todayDate" class="date"></span></div><div id="noticeText" class="notice" data-i18n="communityNotice"></div><section class="stats"><div class="stat"><b id="publishedCount">0</b><span id="publishedLabel" data-i18n="communityPublished"></span></div><div class="stat"><b id="takenCount">0</b><span id="takenLabel" data-i18n="communityTaken"></span></div><div class="stat"><b id="remainingCount">0</b><span id="remainingLabel" data-i18n="communityRemaining"></span></div><div class="stat"><b id="cumulativeCount">0</b><span id="cumulativeLabel" data-i18n="communityCumulative"></span></div></section><section class="ticker"><div class="ticker-head"><b id="latestLabel" data-i18n="communityLatest"></b></div><div class="ticker-window"><div id="tickerTrack" class="ticker-track"><div id="tickerLoading" class="empty" data-i18n="communityLoading"></div></div></div></section><div class="batchbar"><div class="tabs"><button id="tabA" class="tab active" data-batch="A" data-i18n="communityBatchA"></button><button id="tabB" class="tab" data-batch="B" data-i18n="communityBatchB"></button></div><small id="updateText" data-i18n="communityTwice"></small></div><section id="feedList" class="feed"><div id="feedLoading" class="empty" data-i18n="communityLoading"></div></section></main>
<div id="redeemMask" class="redeem-mask" hidden><div class="redeem-card"><h3 id="redeemTitle" data-i18n="communityRedeemTitle"></h3><div id="redeemBody"></div><div id="redeemActions" class="redeem-actions"></div></div></div>
<nav class="mobile-bottom-nav"><a href="community.html"><span>◎</span><b id="navCommunity" data-i18n="navCommunity"></b></a><a href="shop.html#supportPanel"><span>✦</span><b id="navSupport" data-i18n="openSupport"></b></a><a href="shop.html" class="nav-home"><span>⌂</span><b id="navHome" data-i18n="home"></b></a><a href="free-zone.html"><span>◇</span><b id="navFree" data-i18n="navFreeZone"></b></a><a href="member.html"><span>◉</span><b id="navMember" data-i18n="navMember"></b></a></nav>
<script src="i18n.js?v=20260819-sitewide-copy-2"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.0/dist/umd/supabase.js"></script><script src="supabase-client.js?v=20260819-community-i18n-1"></script><script src="core-foundation.js?v=20260815-nav-lifecycle-3"></script>
<script>(()=>{'use strict';

const I=window.GYXI18N,lang=I.locale,db=()=>window.gyxSupabase,esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&','<':'<','>':'>','"':'&quot',"'":'&#39;'}[m])),bjDate=()=>new Intl.DateTimeFormat(lang==='zh'?'zh-CN':lang==='km'?'km-KH':'en-US',{timeZone:'Asia/Shanghai',year:'numeric',month:'long',day:'numeric'}).format(new Date());let me=null,rows=[],titles={},active='A',redeemItem=null,tickerOn=false;
const TITLE_STORE='gyx_community_titles_zh';
document.documentElement.lang=lang==='zh'?'zh-CN':lang;document.title=I.t('communityTitle')+' · GlobalYouXuan';I.render(document);document.getElementById('todayDate').textContent=bjDate();
function cleanTitle(v){return String(v||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim()}
function hasHan(v){return /[\u3400-\u9fff]/.test(v||'')}
function opportunityTitle(x){
  const fallback=I.t('communityOpportunityFallback');
  const raw=cleanTitle(x?.title);
  if(lang==='en') return raw||fallback;
  const key='communityOpportunity.'+String(x?.id||'')+'.title';
  const value=I.t(key);
  if(value&&value!==key&&value!==fallback) return value;
  const cached=cleanTitle(titles[x?.id]);
  if(cached) return cached;
  if(lang==='km'&&/[\u1780-\u17ff]/.test(raw)) return raw;
  if(hasHan(raw)) return raw;
  return fallback;
}
function row(x){const code=(x.batch_code||'A')+String(x.opportunity_no||0),closed=x.opportunity_status==='closed',title=opportunityTitle(x);return `<article class="row${closed?' closed':''}"><span class="num">${esc(code)}</span><div class="title" title="${esc(title)}">${esc(title)}</div><button class="take" data-take="${x.id}"${closed?' disabled':''}>${esc(I.t('communityTake'))}</button></article>`}
function render(){const list=rows.filter(x=>x.batch_code===active).sort((a,b)=>(a.opportunity_no||0)-(b.opportunity_no||0));document.getElementById('feedList').innerHTML=list.length?list.map(row).join(''):`<div class="empty">${esc(I.t('communityBatchLoading').replace('{{batch}}',active))}</div>`;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.batch===active))}
function ticker(){const box=document.getElementById('tickerTrack');if(!rows.length){box.innerHTML=`<div class="empty">${esc(I.t('communityLoading'))}</div>`;return}const list=[...rows,...rows.slice(0,5)];box.innerHTML=list.map(x=>`<div class="tick"><i></i><b>${esc((x.batch_code||'A')+String(x.opportunity_no||0))} · ${esc(opportunityTitle(x))}</b></div>`).join('');if(tickerOn)return;tickerOn=true;let i=0;setInterval(()=>{i++;box.style.transition='transform .4s ease';box.style.transform=`translateY(${-i*25}px)`;if(i>=rows.length)setTimeout(()=>{i=0;box.style.transition='none';box.style.transform='translateY(0)'},420)},2600)}
async function stats(){const {data}=await db().rpc('community_opportunity_public_stats_v3');const s=data?.[0]||{};document.getElementById('publishedCount').textContent=s.today_published||0;document.getElementById('takenCount').textContent=s.today_taken||0;document.getElementById('remainingCount').textContent=s.remaining||0;document.getElementById('cumulativeCount').textContent=s.cumulative_taken||0}
function readTitleStore(){try{return JSON.parse(sessionStorage.getItem(TITLE_STORE)||'{}')}catch{return{}}}
function writeTitleStore(){try{sessionStorage.setItem(TITLE_STORE,JSON.stringify(titles))}catch{}}
async function translateTitle(text){
  const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text.slice(0,160))+'&langpair=en|zh-CN');
  const j=await r.json();
  const out=cleanTitle(j?.responseData?.translatedText);
  return hasHan(out)?out:'';
}
async function fillZhTitles(){
  if(lang!=='zh')return;
  Object.assign(titles,readTitleStore());
  const need=rows.filter(x=>x.id&&!titles[x.id]&&!hasHan(cleanTitle(x.title)));
  for(const x of need){
    if(document.hidden)break;
    try{const zh=await translateTitle(cleanTitle(x.title));if(zh){titles[x.id]=zh;writeTitleStore();render()}}catch{}
  }
}
async function loadTranslations(ids){if(lang==='en'||!ids.length)return;const cacheLang=lang==='km'?'km':'zh';try{const {data}=await db().from('community_opportunity_translation_cache').select('opportunity_id,title').eq('lang',cacheLang).in('opportunity_id',ids);(data||[]).forEach(x=>{if(x?.opportunity_id&&x.title)titles[x.opportunity_id]=x.title})}catch{}}
async function load(){try{me=await window.gyxGetVerifiedUser?.()}catch{}if(!me){location.replace('login.html?next=community.html');return}const {data,error}=await db().from('community_external_feed').select('id,title,body,source_url,batch_code,opportunity_no,batch_key,opportunity_status').order('batch_code',{ascending:true}).order('opportunity_no',{ascending:true}).limit(40);if(error){document.getElementById('feedList').innerHTML=`<div class="empty">${esc(I.t('communityFailed'))}</div>`;return}rows=data||[];if(lang==='zh')Object.assign(titles,readTitleStore());await loadTranslations(rows.map(x=>x.id).filter(Boolean));if(!rows.some(x=>x.batch_code==='A')&&rows.some(x=>x.batch_code==='B'))active='B';render();ticker();await stats();await fillZhTitles();ticker()}
function closeRedeem(){document.getElementById('redeemMask').hidden=true;redeemItem=null}
function successRedeem(text){document.getElementById('redeemBody').innerHTML=`<p class="redeem-success">${esc(text)}</p>`;document.getElementById('redeemActions').innerHTML=`<button class="redeem-cancel" type="button" data-close-redeem>${esc(I.t('communityCancel'))}</button><a class="redeem-downloads" href="member.html#downloads">${esc(I.t('communityDownloads'))}</a>`}
async function openRedeem(x){redeemItem=x;const mask=document.getElementById('redeemMask'),body=document.getElementById('redeemBody'),actions=document.getElementById('redeemActions');mask.hidden=false;body.innerHTML='<p class="redeem-note">…</p>';actions.innerHTML='';const {data:a}=await db().from('member_point_accounts').select('balance').eq('user_id',me.id).maybeSingle();const balance=Number(a?.balance||0),short=Math.max(0,2000-balance);body.innerHTML=`<div class="redeem-cost">2000</div><p>${esc(opportunityTitle(x))}</p><p class="redeem-note">${esc(I.t('communityCurrentBalance',{balance}))}</p>${short?`<p class="redeem-short">${esc(I.t('communityShort',{n:String(short)}))}</p>`:''}`;actions.innerHTML=`<button class="redeem-cancel" type="button" data-close-redeem>${esc(I.t('communityCancel'))}</button><button class="redeem-confirm" type="button" data-confirm-redeem${short?' disabled':''}>${esc(I.t('communityConfirm'))}</button>`}
async function redeem(){if(!redeemItem)return;const btn=document.querySelector('[data-confirm-redeem]');if(btn){btn.disabled=true;btn.textContent=I.t('communityWorking')}const {data,error}=await db().rpc('gyx_redeem_community_opportunity',{p_opportunity_id:redeemItem.id});if(error){const m=String(error.message||'');if(m.includes('INSUFFICIENT_POINTS:')){const n=m.split('INSUFFICIENT_POINTS:')[1]?.match(/\d+/)?.[0]||'';document.getElementById('redeemBody').innerHTML=`<p class="redeem-short">${esc(I.t('communityShort',{n}))}</p>`;return}if(m.includes('ALREADY_REDEEMED')){successRedeem(I.t('communityAlready'));return}successRedeem(I.t('communityUnavailable'));return}successRedeem(I.t('communitySuccess'));await stats();window.dispatchEvent(new CustomEvent('gyx:orders-changed',{detail:{source:'community-opportunity-redemption',redemption:data?.[0]||null}}))}
document.addEventListener('click',e=>{const tab=e.target.closest?.('[data-batch]');if(tab){active=tab.dataset.batch;render();return}const take=e.target.closest?.('[data-take]');if(take){const x=rows.find(v=>v.id===take.dataset.take);if(x)openRedeem(x);return}if(e.target.closest?.('[data-close-redeem]')){closeRedeem();return}if(e.target.closest?.('[data-confirm-redeem]')){redeem();return}},true);document.getElementById('redeemMask').addEventListener('click',e=>{if(e.target.id==='redeemMask')closeRedeem()});load();
})();</script>
</body></html>
