<!doctype html><html lang="zh-CN" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f4f8ff"><meta name="robots" content="noindex"><title>交流天地 · GlobalYouXuan</title><script>try{document.documentElement.dataset.theme=localStorage.getItem('gyx_theme')==='dark'?'dark':'light'}catch{document.documentElement.dataset.theme='light'}</script><link rel="stylesheet" href="site.css"><style>.cs{max-width:760px;margin:auto;padding:14px 14px 112px}.top h1{font-size:23px;margin:0}.top p{margin:4px 0 12px;color:var(--muted,#667085);font-size:12px}.hero,.ticker,.card{border:1px solid var(--border,#dfe6ef);background:var(--card,#fff);border-radius:18px}.hero{padding:16px;background:linear-gradient(135deg,rgba(20,120,255,.10),rgba(125,85,255,.09));margin-bottom:10px}.hero strong{display:block;font-size:18px;margin-bottom:5px}.hero span{font-size:12px;line-height:1.65;color:var(--muted,#667085)}.ticker{padding:10px 12px;overflow:hidden}.ticker-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;font-size:12px}.ticker-head b{font-size:14px}.ticker-head span{color:#1478ff;font-weight:800}.ticker-window{height:220px;overflow:hidden}.ticker-track{transition:transform .45s ease}.tick{height:44px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border,#edf1f6);font-size:12px}.tick i{width:6px;height:6px;border-radius:50%;background:#19a974;flex:0 0 auto}.tick b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.tick small{color:var(--muted,#667085);white-space:nowrap}.bar{display:flex;justify-content:space-between;align-items:end;margin:16px 2px 9px}.bar b{font-size:17px}.bar small{color:var(--muted,#667085)}.feed{display:grid;gap:9px}.card{padding:13px}.meta{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:10px;color:var(--muted,#667085)}.source{font-weight:800;color:#1478ff}.title{font-size:15px;font-weight:900;line-height:1.45;margin:7px 0}.body{font-size:12px;line-height:1.65;color:var(--muted,#667085);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.safe{font-size:10px;color:#12835c;background:rgba(25,169,116,.10);padding:5px 8px;border-radius:999px}.open{font-size:11px;font-weight:850;color:#fff;background:#1478ff;text-decoration:none;padding:7px 11px;border-radius:9px}.empty{text-align:center;padding:34px 12px;color:var(--muted,#667085)}@media(max-width:520px){.ticker-window{height:210px}.tick{height:42px}.cs{padding-left:12px;padding-right:12px}}</style></head><body><main class="cs"><div class="top"><h1>交流天地</h1><p>自动发现市场正在需要什么</p></div><section class="hero"><strong>今日接单机会</strong><span>每天自动更新一次，只保留最新20条。优先全球、亚洲、远程和普通人可执行方向；前置保证金、押金、会员费、培训费、充值、垫资类内容不进入。</span></section><section class="ticker"><div class="ticker-head"><b>⚡ 最新机会</b><span>5条滚动</span></div><div class="ticker-window"><div id="tickerTrack" class="ticker-track"><div class="empty">正在读取今日机会…</div></div></div></section><div class="bar"><b>今日20条</b><small id="updateText">自动更新</small></div><section id="feedList" class="feed"><div class="empty">正在读取…</div></section></main><nav class="mobile-bottom-nav"><a href="community.html"><span>◎</span><b>交流天地</b></a><a href="shop.html#supportPanel"><span>✦</span><b>在线客服</b></a><a href="shop.html" class="nav-home"><span>⌂</span><b>首页</b></a><a href="free-zone.html"><span>◇</span><b>免费专区</b></a><a href="member.html"><span>◉</span><b>会员中心</b></a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.0/dist/umd/supabase.js"></script><script src="supabase-client.js?v=20260808-search-config-2"></script><script src="core-foundation.js?v=20260815-nav-lifecycle-3"></script><script>(()=>{'use strict';const db=()=>window.gyxSupabase,esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),ago=d=>{if(!d)return'今日';let n=(Date.now()-new Date(d))/1000;if(n<3600)return Math.max(1,Math.floor(n/60))+'分钟前';if(n<86400)return Math.floor(n/3600)+'小时前';return new Date(d).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'})};function card(x){return `<article class="card"><div class="meta"><span class="source">${esc(x.source_name)}</span><span>${ago(x.published_at||x.created_at)}</span></div><div class="title">${esc(x.title)}</div><div class="body">${esc(x.body)}</div><div class="actions"><span class="safe">已过滤前置收费关键词</span><a class="open" href="${esc(x.source_url)}" target="_blank" rel="noopener noreferrer">查看原文</a></div></article>`}function ticker(rows){const box=document.getElementById('tickerTrack');if(!rows.length){box.innerHTML='<div class="empty">今日机会正在生成</div>';return}const list=[...rows,...rows.slice(0,5)];box.innerHTML=list.map(x=>`<div class="tick"><i></i><b>${esc(x.title)}</b><small>${esc(x.source_name)}</small></div>`).join('');let i=0;const h=innerWidth<=520?42:44;setInterval(()=>{i++;box.style.transition='transform .45s ease';box.style.transform=`translateY(${-i*h}px)`;if(i>=rows.length)setTimeout(()=>{i=0;box.style.transition='none';box.style.transform='translateY(0)'},470)},2800)}async function load(){let me=null;try{me=await window.gyxGetVerifiedUser?.()}catch{}if(!me){location.replace('login.html?next=community.html');return}const {data,error}=await db().from('community_external_feed').select('id,title,body,source_name,source_url,published_at,created_at').order('published_at',{ascending:false,nullsFirst:false}).order('created_at',{ascending:false}).limit(20);const feed=document.getElementById('feedList');if(error){feed.innerHTML='<div class="empty">读取失败，请稍后刷新。</div>';return}const rows=data||[];feed.innerHTML=rows.length?rows.map(card).join(''):'<div class="empty">今日机会正在自动生成，请稍后查看。</div>';ticker(rows);if(rows[0])document.getElementById('updateText').textContent='更新 '+ago(rows[0].created_at)}load()})();</script></body></html>
