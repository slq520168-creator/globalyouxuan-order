<!doctype html><html lang="zh-CN" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f4f8ff"><meta name="robots" content="noindex"><title>今日接单机会 · GlobalYouXuan</title><script>try{document.documentElement.dataset.theme=localStorage.getItem('gyx_theme')==='dark'?'dark':'light'}catch{document.documentElement.dataset.theme='light'}</script><link rel="stylesheet" href="site.css"><style>.cs{max-width:760px;margin:auto;padding:8px 10px 86px}.top{text-align:center;margin-bottom:5px}.top h1{font-size:22px;line-height:1.15;margin:0;font-weight:950}.top .date{display:block;margin-top:2px;font-size:12px;font-weight:800;color:#1478ff}.notice{margin:4px 0 6px;padding:6px 8px;border-radius:9px;background:rgba(255,170,0,.10);color:#9a6500;font-size:10px;line-height:1.35;text-align:center;font-weight:750}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:0 0 6px}.stat{border:1px solid var(--border,#dfe6ef);background:var(--card,#fff);border-radius:10px;text-align:center;padding:5px 2px}.stat b{display:block;font-size:15px;line-height:1.05}.stat span{font-size:9px;color:var(--muted,#667085)}.ticker,.feed{border:1px solid var(--border,#dfe6ef);background:var(--card,#fff);border-radius:12px;overflow:hidden}.ticker{padding:4px 9px;margin-bottom:6px}.ticker-head{display:flex;justify-content:space-between;align-items:center;height:24px;font-size:10px}.ticker-head b{font-size:12px}.ticker-head span{color:#1478ff;font-weight:800}.ticker-window{height:125px;overflow:hidden}.ticker-track{transition:transform .4s ease}.tick{height:25px;display:flex;align-items:center;gap:6px;border-top:1px solid var(--border,#edf1f6);font-size:11px}.tick i{width:5px;height:5px;border-radius:50%;background:#19a974;flex:0 0 auto}.tick b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.batchbar{display:flex;align-items:center;justify-content:space-between;height:30px;margin-top:1px}.tabs{display:flex;gap:5px}.tab{border:1px solid var(--border,#dfe6ef);background:var(--card,#fff);color:inherit;border-radius:8px;height:24px;padding:0 10px;font-size:10px;font-weight:900}.tab.active{background:#1478ff;color:#fff;border-color:#1478ff}.batchbar small{font-size:9px;color:var(--muted,#667085)}.feed{display:block}.row{height:29px;display:grid;grid-template-columns:30px minmax(0,1fr) 48px 44px 38px;align-items:center;gap:3px;padding:0 6px;border-bottom:1px solid var(--border,#edf1f6);font-size:10px}.row:last-child{border-bottom:0}.num{font-weight:950;color:#1478ff;text-align:center}.title{min-width:0;font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{color:var(--muted,#667085);white-space:nowrap;text-align:right;font-size:9px}.support,.done{display:inline-flex;align-items:center;justify-content:center;height:21px;border-radius:6px;text-decoration:none;font-size:9px;font-weight:850;white-space:nowrap;border:0}.support{background:#1478ff;color:#fff}.done{background:rgba(25,169,116,.12);color:#12835c}.done.ok{background:#12835c;color:#fff}.empty{text-align:center;padding:28px 10px;color:var(--muted,#667085);font-size:12px}@media(min-width:700px){.cs{max-width:900px}.feed{display:grid;grid-template-columns:1fr 1fr}.row:nth-child(odd){border-right:1px solid var(--border,#edf1f6)}.row:nth-last-child(-n+2){border-bottom:0}}</style></head><body><main class="cs"><div class="top"><h1>今日接单机会</h1><span id="todayDate" class="date"></span></div><div class="notice">请谨慎辨别真伪；凡要求保证金、押金、会员费、培训费、充值、垫资或先付款的，一律避坑。</div><section class="stats"><div class="stat"><b id="publishedCount">0</b><span>今日发布</span></div><div class="stat"><b id="peopleCount">0</b><span>接单人员</span></div><div class="stat"><b id="orderCount">0</b><span>已实现接单数量</span></div></section><section class="ticker"><div class="ticker-head"><b>⚡ 最新机会</b><span>5行滚动</span></div><div class="ticker-window"><div id="tickerTrack" class="ticker-track"><div class="empty">正在读取今日机会…</div></div></div></section><div class="batchbar"><div class="tabs"><button class="tab active" data-batch="A">A班</button><button class="tab" data-batch="B">B班</button></div><small id="updateText">每日两批</small></div><section id="feedList" class="feed"><div class="empty">正在读取…</div></section></main><nav class="mobile-bottom-nav"><a href="community.html"><span>◎</span><b>交流天地</b></a><a href="shop.html#supportPanel"><span>✦</span><b>在线客服</b></a><a href="shop.html" class="nav-home"><span>⌂</span><b>首页</b></a><a href="free-zone.html"><span>◇</span><b>免费专区</b></a><a href="member.html"><span>◉</span><b>会员中心</b></a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.0/dist/umd/supabase.js"></script><script src="supabase-client.js?v=20260808-search-config-2"></script><script src="core-foundation.js?v=20260815-nav-lifecycle-3"></script><script>(()=>{'use strict';const db=()=>window.gyxSupabase,esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),bjDate=()=>new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'long',day:'numeric'}).format(new Date()),pubTime=d=>d?new Date(d).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric',timeZone:'Asia/Shanghai'}):'未提供';let me=null,rows=[],active='A';document.getElementById('todayDate').textContent=bjDate();function row(x){const code=(x.batch_code||'A')+String(x.opportunity_no||0);return `<article class="row"><span class="num">${esc(code)}</span><div class="title" title="${esc(x.title)}">${esc(x.title)}</div><span class="time">${pubTime(x.published_at)}</span><button class="support" data-request="${x.id}" data-code="${esc(code)}">找客服</button><button class="done" data-done="${x.id}" data-code="${esc(code)}">已接到</button></article>`}function render(){const list=rows.filter(x=>x.batch_code===active).sort((a,b)=>(a.opportunity_no||0)-(b.opportunity_no||0));document.getElementById('feedList').innerHTML=list.length?list.map(row).join(''):`<div class="empty">${active}班机会正在生成</div>`;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.batch===active))}function ticker(){const box=document.getElementById('tickerTrack');if(!rows.length){box.innerHTML='<div class="empty">今日机会正在生成</div>';return}const list=[...rows,...rows.slice(0,5)];box.innerHTML=list.map(x=>`<div class="tick"><i></i><b>${esc((x.batch_code||'A')+String(x.opportunity_no||0))} · ${esc(x.title)}</b></div>`).join('');let i=0;setInterval(()=>{i++;box.style.transition='transform .4s ease';box.style.transform=`translateY(${-i*25}px)`;if(i>=rows.length)setTimeout(()=>{i=0;box.style.transition='none';box.style.transform='translateY(0)'},420)},2600)}async function stats(){const {data}=await db().rpc('community_opportunity_public_stats_v2');const s=data?.[0]||{};document.getElementById('publishedCount').textContent=s.today_published||0;document.getElementById('peopleCount').textContent=s.confirmed_users||0;document.getElementById('orderCount').textContent=s.confirmed_orders||0}async function load(){try{me=await window.gyxGetVerifiedUser?.()}catch{}if(!me){location.replace('login.html?next=community.html');return}const {data,error}=await db().from('community_external_feed').select('id,title,published_at,batch_code,opportunity_no,batch_key').order('batch_code',{ascending:true}).order('opportunity_no',{ascending:true}).limit(40);if(error){document.getElementById('feedList').innerHTML='<div class="empty">读取失败，请稍后刷新。</div>';return}rows=data||[];if(!rows.some(x=>x.batch_code==='A')&&rows.some(x=>x.batch_code==='B'))active='B';render();ticker();await stats()}document.addEventListener('click',async e=>{const tab=e.target.closest?.('[data-batch]');if(tab){active=tab.dataset.batch;render();return}const rq=e.target.closest?.('[data-request]');if(rq){e.preventDefault();await db().from('community_opportunity_stats').upsert({user_id:me.id,opportunity_id:rq.dataset.request,action:'request_url'},{onConflict:'user_id,opportunity_id,action'});location.href='shop.html?opportunity='+encodeURIComponent(rq.dataset.code)+'#supportPanel';return}const dn=e.target.closest?.('[data-done]');if(dn){if(!confirm('确认你已经成功接到 '+dn.dataset.code+' 这条机会？'))return;const {error}=await db().from('community_opportunity_stats').upsert({user_id:me.id,opportunity_id:dn.dataset.done,action:'confirmed_order'},{onConflict:'user_id,opportunity_id,action'});if(!error){dn.classList.add('ok');dn.textContent='已确认';await stats()}return}},true);load()})();</script></body></html>
