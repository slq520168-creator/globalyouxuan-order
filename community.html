ានមិនបាន សូមសាកម្តងទៀតពេលក្រោយ។',take:'ទទួលការងារ',community:'ឱកាសការងារ',onlineSupport:'ជំនួយ',home:'ទំព័រដើម',free:'តំបន់ឥតគិតថ្លៃ',member:'សមាជិក',redeemTitle:'ប្តូរ 2000 ពិន្ទុ',current:'ពិន្ទុបច្ចុប្បន្ន',short:'ពិន្ទុមិនគ្រប់ ខ្វះ {{n}} ពិន្ទុ',confirm:'ប្តូរ',cancel:'បោះបង់',working:'កំពុងប្តូរ…',success:'ប្តូរបានជោគជ័យ បានបញ្ចូលទៅមជ្ឈមណ្ឌលទាញយក',downloads:'ទៅមជ្ឈមណ្ឌលទាញយក',already:'បានប្តូររួច មាតិកានៅមជ្ឈមណ្ឌលទាញយក',unavailable:'ឱកាសនេះមិនអាចប្តូរបានទេ'}};
const lang=(()=>{try{const x=localStorage.getItem('lang');return x==='en'||x==='km'?x:'zh'}catch{return'zh'}})(),tr=k=>T[lang][k]||T.zh[k]||k,db=()=>window.gyxSupabase,esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[m])),bjDate=()=>new Intl.DateTimeFormat(lang==='zh'?'zh-CN':lang==='km'?'km-KH':'en-US',{timeZone:'Asia/Shanghai',year:'numeric',month:'long',day:'numeric'}).format(new Date());let me=null,rows=[],active='A',redeemItem=null;
document.documentElement.lang=lang==='zh'?'zh-CN':lang;document.title=tr('title')+' · GlobalYouXuan';document.getElementById('pageTitle').textContent=tr('title');document.getElementById('todayDate').textContent=bjDate();document.getElementById('noticeText').textContent=tr('notice');document.getElementById('cumulativeLabel').textContent=tr('cumulative');document.getElementById('publishedLabel').textContent=tr('published');document.getElementById('takenLabel').textContent=tr('taken');document.getElementById('remainingLabel').textContent=tr('remaining');document.getElementById('latestLabel').textContent=tr('latest');document.getElementById('tabA').textContent=tr('batchA');document.getElementById('tabB').textContent=tr('batchB');document.getElementById('updateText').textContent=tr('twice');document.getElementById('tickerLoading').textContent=tr('loading');document.getElementById('feedLoading').textContent=tr('loading');document.getElementById('navCommunity').textContent=tr('community');document.getElementById('navSupport').textContent=tr('onlineSupport');document.getElementById('navHome').textContent=tr('home');document.getElementById('navFree').textContent=tr('free');document.getElementById('navMember').textContent=tr('member');document.getElementById('redeemTitle').textContent=tr('redeemTitle');
function row(x){const code=(x.batch_code||'A')+String(x.opportunity_no||0),closed=x.opportunity_status==='closed';return `<article class="row${closed?' closed':''}"><span class="num">${esc(code)}</span><div class="title" title="${esc(x.title)}">${esc(x.title)}</div><button class="take" data-take="${x.id}"${closed?' disabled':''}>${esc(tr('take'))}</button></article>`}
function render(){const list=rows.filter(x=>x.batch_code===active).sort((a,b)=>(a.opportunity_no||0)-(b.opportunity_no||0));document.getElementById('feedList').innerHTML=list.length?list.map(row).join(''):`<div class="empty">${esc(tr('batchLoading').replace('{{batch}}',active))}</div>`;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.batch===active))}
function ticker(){const box=document.getElementById('tickerTrack');if(!rows.length){box.innerHTML=`<div class="empty">${esc(tr('loading'))}</div>`;return}const list=[...rows,...rows.slice(0,5)];box.innerHTML=list.map(x=>`<div class="tick"><i></i><b>${esc((x.batch_code||'A')+String(x.opportunity_no||0))} · ${esc(x.title)}</b></div>`).join('');let i=0;setInterval(()=>{i++;box.style.transition='transform .4s ease';box.style.transform=`translateY(${-i*25}px)`;if(i>=rows.length)setTimeout(()=>{i=0;box.style.transition='none';box.style.transform='translateY(0)'},420)},2600)}
async function stats(){const {data}=await db().rpc('community_opportunity_public_stats_v3');const s=data?.[0]||{};document.getElementById('publishedCount').textContent=s.today_published||0;document.getElementById('takenCount').textContent=s.today_taken||0;document.getElementById('remainingCount').textContent=s.remaining||0;document.getElementById('cumulativeCount').textContent=s.cumulative_taken||0}
async function load(){try{me=await window.gyxGetVerifiedUser?.()}catch{}if(!me){location.replace('login.html?next=community.html');return}const {data,error}=await db().from('community_external_feed').select('id,title,body,source_url,batch_code,opportunity_no,batch_key,opportunity_status').order('batch_code',{ascending:true}).order('opportunity_no',{ascending:true}).limit(40);if(error){document.getElementById('feedList').innerHTML=`<div class="empty">${esc(tr('failed'))}</div>`;return}rows=data||[];if(!rows.some(x=>x.batch_code==='A')&&rows.some(x=>x.batch_code==='B'))active='B';render();ticker();await stats()}
function closeRedeem(){document.getElementById('redeemMask').hidden=true;redeemItem=null}
function successRedeem(text){document.getElementById('redeemBody').innerHTML=`<p class="redeem-success">${esc(text)}</p>`;document.getElementById('redeemActions').innerHTML=`<button class="redeem-cancel" type="button" data-close-redeem>${esc(tr('cancel'))}</button><a class="redeem-downloads" href="member.html#downloads">${esc(tr('downloads'))}</a>`}
async function openRedeem(x){redeemItem=x;const mask=document.getElementById('redeemMask'),body=document.getElementById('redeemBody'),actions=document.getElementById('redeemActions');mask.hidden=false;body.innerHTML='<p class="redeem-note">…</p>';actions.innerHTML='';const {data:a}=await db().from('member_point_accounts').select('balance').eq('user_id',me.id).maybeSingle();const balance=Number(a?.balance||0),short=Math.max(0,2000-balance);body.innerHTML=`<div class="redeem-cost">2000</div><p>${esc(x.title)}</p><p class="redeem-note">${esc(tr('current'))}：${balance}</p>${short?`<p class="redeem-short">${esc(tr('short').replace('{{n}}',String(short)))}</p>`:''}`;actions.innerHTML=`<button class="redeem-cancel" type="button" data-close-redeem>${esc(tr('cancel'))}</button><button class="redeem-confirm" type="button" data-confirm-redeem${short?' disabled':''}>${esc(tr('confirm'))}</button>`}
async function redeem(){if(!redeemItem)return;const btn=document.querySelector('[data-confirm-redeem]');if(btn){btn.disabled=true;btn.textContent=tr('working')}const {data,error}=await db().rpc('gyx_redeem_community_opportunity',{p_opportunity_id:redeemItem.id});if(error){const m=String(error.message||'');if(m.includes('INSUFFICIENT_POINTS:')){const n=m.split('INSUFFICIENT_POINTS:')[1]?.match(/\d+/)?.[0]||'';document.getElementById('redeemBody').innerHTML=`<p class="redeem-short">${esc(tr('short').replace('{{n}}',n))}</p>`;return}if(m.includes('ALREADY_REDEEMED')){successRedeem(tr('already'));return}successRedeem(tr('unavailable'));return}successRedeem(tr('success'));await stats();window.dispatchEvent(new CustomEvent('gyx:orders-changed',{detail:{source:'community-opportunity-redemption',redemption:data?.[0]||null}}))}
document.addEventListener('click',e=>{const tab=e.target.closest?.('[data-batch]');if(tab){active=tab.dataset.batch;render();return}const take=e.target.closest?.('[data-take]');if(take){const x=rows.find(v=>v.id===take.dataset.take);if(x)openRedeem(x);return}if(e.target.closest?.('[data-close-redeem]')){closeRedeem();return}if(e.target.closest?.('[data-confirm-redeem]')){redeem();return}},true);document.getElementById('redeemMask').addEventListener('click',e=>{if(e.target.id==='redeemMask')closeRedeem()});load();
})();</script>
