<!doctype html><html lang="zh-CN" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f4f8ff"><meta name="robots" content="noindex"><title>今日接单机会 · GlobalYouXuan</title><script>try{document.documentElement.dataset.theme=localStorage.getItem('gyx_theme')==='dark'?'dark':'light'}catch{document.documentElement.dataset.theme='light'}</script><link rel="stylesheet" href="site.css"><style>.cs{max-width:760px;margin:auto;padding:8px 10px 86px}.site-url{text-align:center;font-size:10px;color:var(--muted,#667085);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0 0 3px}.top{text-align:center;margin-bottom:6px}.top h1{font-size:22px;line-height:1.15;margin:0;font-weight:950}.top .date{display:block;margin-top:2px;font-size:12px;font-weight:800;color:#1478ff}.ticker,.feed{border:1px solid var(--border,#dfe6ef);background:var(--card,#fff);border-radius:12px;overflow:hidden}.ticker{padding:4px 9px;margin-bottom:6px}.ticker-head{display:flex;justify-content:space-between;align-items:center;height:24px;font-size:10px}.ticker-head b{font-size:12px}.ticker-head span{color:#1478ff;font-weight:800}.ticker-window{height:125px;overflow:hidden}.ticker-track{transition:transform .4s ease}.tick{height:25px;display:flex;align-items:center;gap:6px;border-top:1px solid var(--border,#edf1f6);font-size:11px}.tick i{width:5px;height:5px;border-radius:50%;background:#19a974;flex:0 0 auto}.tick b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.bar{display:flex;justify-content:space-between;align-items:center;height:26px;padding:0 3px}.bar b{font-size:13px}.bar small{font-size:9px;color:var(--muted,#667085)}.feed{display:block}.row{height:29px;display:grid;grid-template-columns:25px minmax(0,1fr) 42px 34px;align-items:center;gap:4px;padding:0 7px;border-bottom:1px solid var(--border,#edf1f6);font-size:10px}.row:last-child{border-bottom:0}.num{font-weight:900;color:#1478ff;text-align:center}.title{min-width:0;font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{color:var(--muted,#667085);white-space:nowrap;text-align:right;font-size:9px}.open{display:inline-flex;align-items:center;justify-content:center;height:21px;border-radius:6px;background:#1478ff;color:#fff;text-decoration:none;font-size:9px;font-weight:850}.empty{text-align:center;padding:28px 10px;color:var(--muted,#667085);font-size:12px}@media(min-width:700px){.cs{max-width:900px}.feed{display:grid;grid-template-columns:1fr 1fr}.row:nth-child(odd){border-right:1px solid var(--border,#edf1f6)}.row:nth-last-child(-n+2){border-bottom:0}}</style></head><body><main class="cs"><div class="site-url">https://globalyouxuan-order.pages.dev/community.html</div><div class="top"><h1>今日接单机会</h1><span id="todayDate" class="date"></span></div><section class="ticker"><div class="ticker-head"><b>⚡ 最新机会</b><span>5行滚动</span></div><div class="ticker-window"><div id="tickerTrack" class="ticker-track"><div class="empty">正在读取今日机会…</div></div></div></section><div class="bar"><b>今日20条</b><small id="updateText">每日自动更新</small></div><section id="feedList" class="feed"><div class="empty">正在读取…</div></section></main><nav class="mobile-bottom-nav"><a href="community.html"><span>◎</span><b>交流天地</b></a><a href="shop.html#supportPanel"><span>✦</span><b>在线客服</b></a><a href="shop.html" class="nav-home"><span>⌂</span><b>首页</b></a><a href="free-zone.html"><span>◇</span><b>免费专区</b></a><a href="member.html"><span>◉</span><b>会员中心</b></a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.0/dist/umd/supabase.js"></script><script src="supabase-client.js?v=20260808-search-config-2"></script><script src="core-foundation.js?v=20260815-nav-lifecycle-3"></script><script>(()=>{'use strict';const db=()=>window.gyxSupabase,esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),ago=d=>{if(!d)return'今日';let n=(Date.now()-new Date(d))/1000;if(n<3600)return Math.max(1,Math.floor(n/60))+'分';if(n<86400)return Math.floor(n/3600)+'时';return new Date(d).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'})},bjDate=()=>new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'long',day:'numeric'}).format(new Date());document.getElementById('todayDate').textContent=bjDate();function row(x,i){return `<article class="row"><span class="num">${String(i+1).padStart(2,'0')}</span><div class="title" title="${esc(x.title)}">${esc(x.title)}</div><span class="time">${ago(x.published_at||x.created_at)}</span><a class="open" href="${esc(x.source_url)}" target="_blank" rel="noopener noreferrer">查看</a></article>`}function ticker(rows){const box=document.getElementById('tickerTrack');if(!rows.length){box.innerHTML='<div class="empty">今日机会正在生成</div>';return}const list=[...rows,...rows.slice(0,5)];box.innerHTML=list.map(x=>`<div class="tick"><i></i><b>${esc(x.title)}</b></div>`).join('');let i=0;setInterval(()=>{i++;box.style.transition='transform .4s ease';box.style.transform=`translateY(${-i*25}px)`;if(i>=rows.length)setTimeout(()=>{i=0;box.style.transition='none';box.style.transform='translateY(0)'},420)},2600)}async function load(){let me=null;try{me=await window.gyxGetVerifiedUser?.()}catch{}if(!me){location.replace('login.html?next=community.html');return}const {data,error}=await db().from('community_external_feed').select('id,title,source_url,published_at,created_at').order('published_at',{ascending:false,nullsFirst:false}).order('created_at',{ascending:false}).limit(20);const feed=document.getElementById('feedList');if(error){feed.innerHTML='<div class="empty">读取失败，请稍后刷新。</div>';return}const rows=data||[];feed.innerHTML=rows.length?rows.map(row).join(''):'<div class="empty">今日机会正在自动生成，请稍后查看。</div>';ticker(rows);if(rows[0])document.getElementById('updateText').textContent='更新 '+ago(rows[0].created_at)}load()})();</script></body></html>
