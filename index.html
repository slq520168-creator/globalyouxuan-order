<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020816">
  <title>GlobalYouXuan｜连接全球智慧</title>
  <meta name="description" content="GlobalYouXuan 数字化智能服务平台">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>

  <header class="topbar">
    <a class="brand" href="#" aria-label="GlobalYouXuan 首页">
      <span class="brand-mark">G</span>
      <span class="brand-name">GlobalYouXuan</span>
    </a>
    <div class="top-actions">
      <button class="language" type="button" aria-label="切换语言">
        <span class="globe">◎</span><span>中文</span><span class="chevron">⌄</span>
      </button>
      <button class="menu" type="button" aria-label="打开菜单"><i></i><i></i><i></i></button>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="headline-wrap">
        <h1>连接全球智慧<br>驱动数字<span class="future">未来</span></h1>
        <p>助力企业与个人实现数字化升级</p>
      </div>

      <div class="earth" aria-hidden="true">
        <div class="earth-grid"></div>
        <div class="sunrise"></div>
      </div>

      <form class="search" id="aiSearch">
        <span class="sparkles">✦</span>
        <input id="query" type="search" placeholder="AI 智能搜索，探索解决方案..." autocomplete="off">
        <button type="submit" aria-label="搜索">
          <span></span>
        </button>
      </form>

      <section class="cards" aria-label="核心功能">
        <a class="card blue" href="#website">
          <div class="icon icon-browser">
            <span class="browser-top"></span><span class="browser-line l1"></span><span class="browser-line l2"></span>
          </div>
          <h2>网站建设</h2>
          <span class="up">↑</span>
        </a>
        <a class="card purple" href="#future">
          <div class="icon icon-brain">☁</div>
          <h2>智控未来</h2>
          <span class="up">↑</span>
        </a>
        <a class="card cyan" href="#data">
          <div class="icon icon-chart">
            <span class="bar b1"></span><span class="bar b2"></span><span class="bar b3"></span>
            <span class="trend"></span>
          </div>
          <h2>量化感知</h2>
          <span class="up">↑</span>
        </a>
        <a class="card orange" href="#academy">
          <div class="icon icon-cap">
            <span class="cap-top"></span><span class="cap-base"></span>
          </div>
          <h2>数字学院</h2>
          <span class="up">↑</span>
        </a>
      </section>
    </section>
  </main>

  <div class="toast" id="toast" role="status"></div>
  <script src="script.js"></script>
</body>
</html>
