<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USDT Payment</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f0f2f5; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 90%; width: 350px; }
        h2 { color: #26a17b; margin-top: 0; }
        .qr-box { margin: 20px 0; padding: 10px; border: 1px dashed #ccc; display: inline-block; }
        .address { word-break: break-all; background: #eee; padding: 10px; border-radius: 5px; font-size: 14px; color: #333; margin-bottom: 15px; }
        .btn { background: #26a17b; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-size: 16px; cursor: pointer; text-decoration: none; display: inline-block; }
    </style>
</head>
<body>
    <div class="card">
        <h2>💎 USDT (TRC20) 支付</h2>
        <p>请扫描下方二维码转账</p>
        
        <div class="qr-box">
            <!-- 这里会自动生成您的收款码 -->
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=TPH7Kxjzhkax3oETmMpTCmgMWi3TX4bviH" alt="QR Code" style="width: 200px; height: 200px;">
        </div>

        <div class="address">
            TPH7Kxjzhkax3oETmMpTCmgMWi3TX4bviH
        </div>

        <p style="font-size: 12px; color: #666;">转账后请联系客服确认</p>
    </div>
</body>
</html>
