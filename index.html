<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>GlobalYouXuan｜全球优选</title>
  <meta name="description" content="3分钟上手，用AI解决一个实际问题。">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    body{
      color:#fff;
      background:
        radial-gradient(circle at 50% 0%,rgba(0,214,170,.20),transparent 35%),
        radial-gradient(circle at 100% 100%,rgba(46,113,255,.18),transparent 38%),
        #07111f;
    }
    button{font:inherit}
    .page{
      width:min(100%,620px);
      min-height:100vh;
      margin:auto;
      padding:calc(22px + env(safe-area-inset-top)) 20px calc(30px + env(safe-area-inset-bottom));
      display:flex;
      flex-direction:column;
    }
    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:800;
      letter-spacing:.2px;
    }
    .logo{
      width:38px;
      height:38px;
      border-radius:13px;
      display:grid;
      place-items:center;
      color:#07111f;
      background:linear-gradient(135deg,#45f3c0,#25a9ff);
      box-shadow:0 10px 28px rgba(34,220,183,.28);
      font-size:18px;
      font-weight:900;
    }
    .badge{
      padding:7px 11px;
      border:1px solid rgba(255,255,255,.12);
      border-radius:999px;
      color:#9fb0c6;
      font-size:12px;
      background:rgba(255,255,255,.045);
    }
    main{
      flex:1;
      display:flex;
      flex-direction:column;
      justify-content:center;
      padding:42px 0 28px;
    }
    .eyebrow{
      color:#43e7ba;
      font-size:13px;
      font-weight:750;
      letter-spacing:1.5px;
      margin-bottom:13px;
    }
    h1{
      margin:0;
      max-width:520px;
      font-size:clamp(34px,9vw,56px);
      line-height:1.08;
      letter-spacing:-1.8px;
    }
    .highlight{
      background:linear-gradient(90deg,#46efc0,#55a9ff);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }
    .subtitle{
      margin:18px 0 30px;
      color:#a8b6c9;
      font-size:16px;
      line-height:1.75;
    }
    .grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:12px;
    }
    .card{
      min-height:116px;
      padding:18px;
      border:1px solid rgba(255,255,255,.10);
      border-radius:20px;
      background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.035));
      color:#fff;
      text-align:left;
      cursor:pointer;
      transition:.2s ease;
      box-shadow:0 14px 35px rgba(0,0,0,.15);
    }
    .card:active{
      transform:scale(.97);
      border-color:rgba(68,235,190,.55);
    }
    .icon{
      width:38px;
      height:38px;
      border-radius:12px;
      display:grid;
      place-items:center;
      margin-bottom:14px;
      background:rgba(68,235,190,.13);
      font-size:20px;
    }
    .card strong{
      display:block;
      font-size:18px;
      margin-bottom:5px;
    }
    .card small{
      color:#94a5ba;
      font-size:12px;
    }
    .promise{
      margin-top:24px;
      display:flex;
      align-items:center;
      gap:10px;
      color:#9fb0c6;
      font-size:13px;
    }
    .dot{
      width:8px;
      height:8px;
      border-radius:50%;
      background:#46efc0;
      box-shadow:0 0 16px #46efc0;
    }
    footer{
      text-align:center;
      color:#64748b;
      font-size:12px;
      padding-top:12px;
    }
    .modal{
      position:fixed;
      inset:0;
      display:none;
      align-items:flex-end;
      justify-content:center;
      padding:20px;
      background:rgba(0,0,0,.64);
      backdrop-filter:blur(8px);
    }
    .modal.show{display:flex}
    .sheet{
      width:min(100%,560px);
      padding:24px;
      border-radius:25px;
      background:#101d2d;
      border:1px solid rgba(255,255,255,.12);
      box-shadow:0 25px 80px rgba(0,0,0,.45);
    }
    .sheet h2{margin:0 0 10px;font-size:24px}
    .sheet p{margin:0 0 20px;color:#9fb0c6;line-height:1.65}
    .close{
      width:100%;
      border:0;
      border-radius:15px;
      padding:14px;
      font-weight:800;
      color:#07111f;
      background:linear-gradient(90deg,#46efc0,#55a9ff);
    }
    @media(max-width:360px){
      .page{padding-left:15px;padding-right:15px}
      .card{padding:15px;min-height:108px}
    }
  </style>
</head>

<body>
  <div class="page">
    <header class="topbar">
      <div class="brand">
        <div class="logo">G</div>
        <span>GlobalYouXuan</span>
      </div>
      <div class="badge">全球优选</div>
    </header>

    <main>
      <div class="eyebrow">AI 实用解决方案</div>

      <h1>
        今天，你想让 AI<br>
        帮你<span class="highlight">解决什么？</span>
      </h1>

      <p class="subtitle">
        不学复杂理论，不看几十页教程。<br>
        一个问题，一个方案，3分钟马上使用。
      </p>

      <section class="grid">
        <button class="card" onclick="openModule('工作')">
          <span class="icon">💼</span>
          <strong>工作</strong>
          <small>文案、表格、总结</small>
        </button>

        <button class="card" onclick="openModule('创作')">
          <span class="icon">✨</span>
          <strong>创作</strong>
          <small>图片、视频、内容</small>
        </button>

        <button class="card" onclick="openModule('商业')">
          <span class="icon">📈</span>
          <strong>商业</strong>
          <small>营销、销售、获客</small>
        </button>

        <button class="card" onclick="openModule('自动化')">
          <span class="icon">⚡</span>
          <strong>自动化</strong>
          <small>流程、提醒、执行</small>
        </button>
      </section>

      <div class="promise">
        <span class="dot"></span>
        <span>短小精悍 · 直接复制 · 马上能用</span>
      </div>
    </main>

    <footer>
      © 2026 GlobalYouXuan
    </footer>
  </div>

  <div class="modal" id="modal" onclick="closeOutside(event)">
    <div class="sheet">
      <h2 id="modalTitle">解决方案</h2>
      <p>
        该分类的实用解决方案正在陆续上架。网站交易系统完成后，可直接购买并自动接收内容。
      </p>
      <button class="close" onclick="closeModal()">知道了</button>
    </div>
  </div>

  <script>
    function openModule(name){
      document.getElementById("modalTitle").textContent = name + "解决方案";
      document.getElementById("modal").classList.add("show");
    }

    function closeModal(){
      document.getElementById("modal").classList.remove("show");
    }

    function closeOutside(event){
      if(event.target.id === "modal") closeModal();
    }
  </script>
</body>
</html>
