<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>全球优选｜数字商品自助下单</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html">
    <span class="logo">优</span>
    <span><strong id="brandName">全球优选</strong><small>数字商品自助下单</small></span>
  </a>
  <div class="top-actions">
    <button class="ghost" id="orderQueryBtn">查询订单</button>
    <a class="ghost" id="supportLink" href="#" target="_blank">联系客服</a>
  </div>
</header>

<main>
  <section class="hero">
    <div class="hero-inner">
      <span class="pill">USDT付款 · 自动确认 · 自动发货</span>
      <h1>数字商品，付款后自动交付</h1>
      <p>无需注册，只填写收货邮箱即可创建订单。</p>
      <a class="primary hero-btn" href="#products">立即选购</a>
    </div>
  </section>

  <section class="wrap" id="products">
    <div class="section-head">
      <div><small>PRODUCTS</small><h2>商品中心</h2></div>
      <input id="searchInput" type="search" placeholder="搜索商品">
    </div>

    <div id="categoryBar" class="categories"></div>
    <div id="productGrid" class="grid"></div>
    <div id="emptyState" class="empty hidden">没有找到相关商品</div>
  </section>
</main>

<footer>
  <strong id="footerBrand">全球优选</strong>
  <span>安全付款 · 自动发货 · 邮箱交付</span>
</footer>

<div id="productModal" class="modal hidden">
  <div class="modal-card">
    <button class="close" data-close="productModal">×</button>

    <section id="orderStep">
      <span class="pill dark">创建订单</span>
      <div class="product-summary">
        <div id="modalEmoji" class="summary-icon">📦</div>
        <div><h2 id="modalName"></h2><p id="modalDesc"></p></div>
      </div>

      <div class="price-row"><span>商品价格</span><strong><span id="modalPrice"></span> USDT</strong></div>

      <label>收货邮箱 *</label>
      <input id="emailInput" type="email" placeholder="name@example.com" autocomplete="email">

      <label>Telegram（选填）</label>
      <input id="telegramInput" placeholder="@username">

      <label>备注（选填）</label>
      <textarea id="noteInput" placeholder="需要说明的内容"></textarea>

      <button id="createOrderBtn" class="primary full">创建订单</button>
    </section>

    <section id="paymentStep" class="hidden">
      <span class="pill warning">等待付款</span>
      <h2>请按订单金额付款</h2>

      <div class="order-box">
        <div><span>订单号</span><strong id="orderNo"></strong></div>
        <div><span>网络</span><strong id="networkText"></strong></div>
        <div><span>应付金额</span><strong><span id="payAmount"></span> USDT</strong></div>
      </div>

      <label>收款地址</label>
      <div class="copy-row">
        <input id="walletInput" readonly>
        <button id="copyWalletBtn" class="ghost">复制</button>
      </div>

      <div id="qrBox" class="qr-box">
        <div class="qr-pattern" aria-hidden="true"></div>
        <small>请使用对应网络付款</small>
      </div>

      <p class="timer">订单有效期：<strong id="countdown">15:00</strong></p>
      <div id="paymentStatus" class="status waiting">正在等待链上付款确认……</div>

      <button id="simulatePaidBtn" class="secondary full">测试付款成功</button>
      <p class="tip">当前按钮用于网站测试。真实上线时接入链上查询后自动确认。</p>
    </section>

    <section id="successStep" class="hidden success">
      <div class="check">✓</div>
      <h2>付款成功，商品已交付</h2>
      <p>交付邮箱：<strong id="deliveryEmail"></strong></p>
      <div id="deliveryBox" class="delivery-box"></div>
      <button class="primary full" data-close="productModal">完成</button>
    </section>
  </div>
</div>

<div id="queryModal" class="modal hidden">
  <div class="modal-card small-card">
    <button class="close" data-close="queryModal">×</button>
    <span class="pill dark">订单查询</span>
    <h2>查询我的订单</h2>
    <label>订单号</label>
    <input id="queryOrderNo" placeholder="例如：GYX2026...">
    <label>收货邮箱</label>
    <input id="queryEmail" type="email" placeholder="下单时填写的邮箱">
    <button id="queryBtn" class="primary full">立即查询</button>
    <div id="queryResult"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
