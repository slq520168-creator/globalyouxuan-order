<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="robots" content="noindex" />
    <title>GlobalYouXuan · Payment</title>
  </head>
  <body>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.0/dist/umd/supabase.js"></script>
    <script src="supabase-client.js?v=20260811-auth-cache-1"></script>
    <script src="member-payment.js?v=20260818-single-main-flow-1"></script>
    <script>
      (async () => {
        "use strict";
        const params = new URLSearchParams(location.search);
        const orderNo = String(
          params.get("order") || params.get("manualpay") || params.get("pay") || "",
        ).trim();
        if (!orderNo) {
          location.replace("member.html#orders");
          return;
        }
        for (let i = 0; i < 100 && !window.GYX_PAY?.open; i += 1)
          await new Promise((resolve) => setTimeout(resolve, 25));
        if (window.GYX_PAY?.open) window.GYX_PAY.open(orderNo);
        else location.replace("member.html#orders");
      })();
    </script>
  </body>
</html>
