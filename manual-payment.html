<style>html,body{min-height:100%;margin:0;background:var(--bg,#f4f8ff);color:var(--text,#152238)}.mp{width:min(100% - 20px,680px);margin:auto;padding:10px 0 28px}.mp-card{margin-top:10px;padding:14px;border:1px solid var(--line,#d9e2ef);border-radius:16px;background:var(--panel,#fff)}.mp-amount{font-size:34px;font-weight:950;margin:5px 0}.mp-original{font-size:12px;opacity:.68;font-weight:700}.mp-methods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.mp-method{padding:11px 8px;border:2px solid var(--line,#d9e2ef);border-radius:14px;text-align:center}.mp-method b{display:block}.mp-account{margin-top:7px;padding:9px 6px;border-radius:9px;background:rgba(20,120,255,.07);font-weight:900;word-break:break-all;font-size:14px}.mp-copy,.mp-submit{width:100%;min-height:48px;border:0;border-radius:11px;background:#1478ff;color:#fff;font-weight:900;font-size:16px}.mp-copy{margin-top:7px}.mp-form{display:grid;gap:9px}.mp-form label{font-weight:900}.mp-form select,.mp-form input{box-sizing:border-box;width:100%;min-height:56px;border:2px solid var(--line,#d9e2ef);border-radius:13px;padding:0 13px;background:var(--panel,#fff);color:inherit;font:inherit;font-size:17px}.mp-form select{font-weight:900;cursor:pointer}.mp-note{font-size:13px;line-height:1.5;opacity:.78;margin:8px 0 0}.mp-help{padding:10px 12px;border-radius:12px;background:#eef5ff;font-size:13px;line-height:1.55;font-weight:750}.mp-status{font-weight:850;line-height:1.5}.mp-success{margin-top:10px;padding:14px;border-radius:14px;background:#eef9f2;border:2px solid #38a169;font-weight:900;text-align:center}.mp-success a{display:flex;min-height:50px;margin-top:10px;border-radius:12px;background:#1478ff;color:white;text-decoration:none;align-items:center;justify-content:center;font-weight:950}.mp-error{color:#c62828;font-weight:850}.mp-loading{min-height:100dvh;display:grid;place-items:center;padding:20px;font-weight:850}@media(max-width:430px){.mp{width:min(100% - 16px,680px)}.mp-methods{grid-template-columns:repeat(3,minmax(0,1fr))}.mp-method{padding:9px 5px}.mp-account{font-size:12px}.mp-amount{font-size:31px}}</style>
</head><body><div id="app" class="mp-loading">正在打开付款页面…</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.0/dist/umd/supabase.js"></script><script src="supabase-client.js?v=20260814-manual-submit-edge-1"></script>
<script>(async function(){'use strict';const app=document.getElementById('app'),p=new URLSearchParams(location.search),ref=p.get('order')||p.get('manualpay')||'',via=p.get('via')||'';const esc=v=>String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));const raw=String(localStorage.getItem('lang')||document.documentElement.lang||'zh').toLowerCase(),lang=raw.startsWith('en')?'en':raw.startsWith('km')?'km':'zh';const L=(z,e,k)=>lang==='en'?e:lang==='km'?k:z;function fail(m){app.className='mp';app.innerHTML='<div class="mp-card mp-error">'+esc(m)+'</div><div class="mp-card"><a href="member.html#orders">'+L('返回会员中心查看进度','Return to member center','ត្រឡប់ទៅមជ្ឈមណ្ឌលសមាជិក')+'</a></div>'}if(!ref){location.replace('member.html#orders');return}for(let i=0;i<100&&!window.gyxSupabase;i++)await new Promise(r=>setTimeout(r,50));const db=window.gyxSupabase;if(!db){fail(L('付款系统加载失败，请刷新重试','Payment system failed to load. Refresh and retry.','ប្រព័ន្ធបង់ប្រាក់ផ្ទុកបរាជ័យ'));return}const user=await window.gyxGetVerifiedUser?.();if(!user){location.replace('login.html?next='+encodeURIComponent(location.pathname+location.search));return}let q=db.from('orders').select('id,order_no,user_id,product_name,matched_answer_title,payable_amount,currency,status').eq('user_id',user.id);q=/^\d+$/.test(ref)?q.eq('id',Number(ref)):q.eq('order_no',ref);const {data:o,error:oe}=await q.maybeSingle();if(oe||!o){fail(L('没有找到这笔订单','Order not found','រកមិនឃើញការបញ្ជាទិញ'));return}if(o.status==='delivered'){location.replace('member.html#downloads');return}if(o.status==='paid'){location.replace('member.html#orders');return}const [{data:ss},quote]=await Promise.all([db.from('manual_payment_settings').select('method,account_value,qr_url,is_active').eq('is_active',true).order('method'),window.gyxInvokeFunction('manual-payment-quote',{order_id:o.id}).catch(()=>null)]);if(!quote?.ok||!Number.isFinite(Number(quote.quote_amount))){fail(L('人民币金额获取失败，为避免付错金额，当前不能付款。请稍后刷新重试。','Unable to load CNY amount. Payment is disabled to prevent an incorrect amount.','មិនអាចទាញចំនួន CNY បាន។'));return}const name=m=>m==='wechat'?L('微信','WeChat','WeChat'):m==='alipay'?L('支付宝','Alipay','Alipay'):L('银行卡','Bank card','កាតធនាគារ');const cards=(ss||[]).map(x=>'<div class="mp-method"><b>'+esc(name(x.method))+'</b>'+(x.qr_url?'<img src="'+esc(x.qr_url)+'" alt="'+esc(name(x.method))+'" style="display:block;width:120px;max-width:100%;margin:7px auto;border-radius:10px">':'')+'<div class="mp-account">'+esc(x.account_value)+'</div><button class="mp-copy" type="button" data-copy="'+esc(x.account_value)+'">'+L('复制','Copy','ចម្លង')+'</button></div>').join('');app.className='mp';app.innerHTML='<div class="mp-card"><div>'+L('本次交付','Delivery','ការប្រគល់')+'</div><h3 style="margin:5px 0 10px">'+esc(o.matched_answer_title||o.product_name||'')+'</h3><div>'+L('人民币应付金额','Amount due in CNY','ចំនួន CNY ត្រូវបង់')+'</div><div class="mp-amount">¥'+Number(quote.quote_amount).toFixed(2)+' CNY</div><div class="mp-original">'+L('原订单','Original order','ការបញ្ជាទិញដើម')+' '+Number(quote.base_amount||o.payable_amount||0).toFixed(2)+' USDT · 1 USDT ≈ ¥'+Number(quote.rate||0).toFixed(4)+'</div><p class="mp-note">'+L('微信、支付宝、银行卡任选一种，按页面人民币金额付款。','Choose WeChat, Alipay, or bank transfer and pay the CNY amount shown.','ជ្រើសវិធីមួយ ហើយបង់ចំនួន CNY ដែលបង្ហាញ។')+'</p></div><div class="mp-card"><div class="mp-methods">'+cards+'</div></div><div class="mp-card"><form id="form" class="mp-form"><label>'+L('选择提交正确的转账方式','Select the payment method you actually used','ជ្រើសវិធីបង់ប្រាក់ដែលអ្នកបានប្រើ')+'</label><select id="method"><option value="wechat">'+L('微信','WeChat','WeChat')+'</option><option value="alipay">'+L('支付宝','Alipay','Alipay')+'</option><option value="bank">'+L('银行卡','Bank card','កាតធនាគារ')+'</option></select><label>'+L('付款单号 / 流水号','Payment reference','លេខយោង')+'</label><div class="mp-help">'+L('在微信/支付宝/银行付款记录中打开这笔转账的“交易详情”，复制订单号、交易号或银行流水号后粘贴到下方。','Open the transfer details in WeChat, Alipay, or your bank app and copy the order/reference/transaction number.','បើកព័ត៌មានលម្អិតនៃការផ្ទេរ ហើយចម្លងលេខបញ្ជាទិញ ឬលេខប្រតិបត្តិការ។')+'</div><input id="reference" maxlength="120" placeholder="'+L('粘贴付款后的订单号或流水号','Paste payment reference','បិទភ្ជាប់លេខយោង')+'" required><button id="submit" class="mp-submit" type="submit">'+L('提交付款核验','Submit for verification','ដាក់ស្នើ')+'</button><div id="msg" class="mp-status"></div></form></div>';if(['wechat','alipay','bank'].includes(via))document.getElementById('method').value=via;app.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy||'');b.textContent=L('已复制','Copied','បានចម្លង')}catch{b.textContent=L('长按复制','Hold to copy','ចុចឲ្យជាប់')}});document.getElementById('form').onsubmit=async e=>{e.preventDefault();const method=document.getElementById('method').value,reference=String(document.getElementById('reference').value||'').trim(),msg=document.getElementById('msg'),btn=document.getElementById('submit');if(reference.length<3){msg.textContent=L('请输入付款单号或流水号','Enter payment reference','សូមបញ្ចូលលេខយោង');return}btn.disabled=true;msg.textContent=L('正在提交…','Submitting…','កំពុងដាក់ស្នើ…');try{const r=await window.gyxInvokeFunction('manual-payment-submit',{order_id:o.id,method,reference});if(!r?.ok)throw new Error(r?.error||'SUBMIT_FAILED');msg.innerHTML='<div class="mp-success">'+L('付款信息已提交核验','Payment submitted for verification','បានដាក់ស្នើការទូទាត់')+'<a href="member.html#orders">'+L('返回会员中心查看进度','Return to member center to view progress','ត្រឡប់ទៅមជ្ឈមណ្ឌលសមាជិកដើម្បីមើលវឌ្ឍនភាព')+'</a></div>';btn.style.display='none'}catch(err){console.error('manual payment submit',err);msg.textContent=L('提交失败，请重试','Submission failed. Retry.','ដាក់ស្នើបរាជ័យ');btn.disabled=false}}})();</script></body></html>
