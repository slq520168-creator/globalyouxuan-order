<!doctype html><html lang="zh-CN" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>全球优选｜管理员登录</title><link rel="stylesheet" href="site.css"><style>body{margin:0;background:#f4f8ff;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.box{width:min(420px,calc(100% - 32px));margin:12vh auto;background:#fff;border:1px solid #dfe7f1;border-radius:22px;padding:24px;box-sizing:border-box;box-shadow:0 18px 50px rgba(32,54,86,.08)}h1{margin:0 0 6px;font-size:25px}p{margin:0 0 20px;color:#6b7485;font-size:13px;line-height:1.6}label{display:block;font-size:13px;font-weight:700;margin:13px 0 6px}input{width:100%;box-sizing:border-box;border:1px solid #d7dfeb;border-radius:12px;padding:13px;font-size:16px}button{width:100%;border:0;border-radius:12px;padding:13px;margin-top:18px;background:#1767e8;color:#fff;font-size:15px;font-weight:800}.msg{margin-top:13px;font-size:13px;line-height:1.5}.back{display:block;text-align:center;margin-top:16px;color:#64748b;text-decoration:none;font-size:13px}</style></head><body><main class="box"><h1>管理员登录</h1><p>管理员账号与普通会员使用同一身份系统，但只有后台授权名单中的账号才能进入控制中心。</p><form id="form"><label>管理员邮箱</label><input id="email" type="email" autocomplete="username" required><label>密码</label><input id="password" type="password" autocomplete="current-password" required minlength="6"><button id="submit" type="submit">登录后台</button></form><div id="msg" class="msg"></div><a class="back" href="shop.html">返回网站</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.0/dist/umd/supabase.js"></script><script src="supabase-client.js?v=20260808-admin-login-1"></script><script>const f=document.getElementById('form'),m=document.getElementById('msg'),b=document.getElementById('submit');async function check(){const u=await window.gyxGetVerifiedUser?.();if(!u)return false;try{const d=await window.gyxInvokeFunction('admin-api',{action:'me'});if(d?.ok){location.replace('admin.html');return true}}catch{}return false}f.onsubmit=async e=>{e.preventDefault();b.disabled=true;m.textContent='正在验证管理员身份…';try{const {error}=await window.gyxSupabase.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)throw error;const d=await window.gyxInvokeFunction('admin-api',{action:'me'});if(!d?.ok)throw new Error('该账号没有管理员权限');location.replace('admin.html')}catch(err){await window.gyxSupabase?.auth.signOut();m.textContent=err?.code==='ADMIN_REQUIRED'||String(err?.message).includes('ADMIN_REQUIRED')?'该账号尚未获得管理员权限。':'登录失败：'+(err?.message||'请检查账号密码')}finally{b.disabled=false}};check();</script></body></html>
