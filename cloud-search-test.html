<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云端完整链路测试</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;margin:0;padding:18px;color:#111}.wrap{max-width:760px;margin:auto}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px;margin-bottom:14px}.row{display:flex;gap:10px}.row input{flex:1;padding:12px;border:1px solid #ccd3df;border-radius:10px;font-size:16px}.row button{padding:0 18px;border:0;border-radius:10px;background:#1767e8;color:#fff;font-weight:700}pre{white-space:pre-wrap;word-break:break-word;background:#0b1020;color:#e9eefc;border-radius:12px;padding:14px;min-height:240px}.ok{color:#0a8f4d}.bad{color:#c62828}</style></head><body><div class="wrap"><div class="card"><h2>云端完整链路测试</h2><p>完全绕开正式前台、本地资料库、会员保存和Supabase会话同步，直接测试云端从第1轮到最终答案的速度。</p><div class="row"><input id="q" value="刘德华"><button id="run">开始测试</button></div></div><div class="card"><div id="status">待测试</div><pre id="log"></pre></div></div><script>
const API='https://globalyouxuan-ai.slq520168.workers.dev/api/chat';
const $=id=>document.getElementById(id),log=$('log'),status=$('status');
function add(s){log.textContent+=s+'\n';log.scrollTop=log.scrollHeight}
function pick(raw){try{const j=JSON.parse(raw);for(const v of [j?.response,j?.reply,j?.text,j?.content,j?.message,j?.output,j?.answer,j?.result?.text,j?.choices?.[0]?.message?.content])if(typeof v==='string'&&v.trim())return v.trim()}catch{}return raw.trim()}
function parse(s){s=s.replace(/```json|```/gi,'').trim();try{return JSON.parse(s)}catch{const a=s.indexOf('{'),b=s.lastIndexOf('}');if(a>=0&&b>a)try{return JSON.parse(s.slice(a,b+1))}catch{};return null}}
async function ask(messages){const t=performance.now();const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({messages})});const raw=await r.text();if(!r.ok)throw new Error('HTTP '+r.status+' '+raw.slice(0,180));return {text:pick(raw),ms:Math.round(performance.now()-t)}}
$('run').onclick=async()=>{log.textContent='';status.textContent='测试中…';const original=$('q').value.trim()||'刘德华',chosen=[],rounds=[];const total=performance.now();try{for(let round=1;round<=5;round++){const prompt={originalQuestion:original,previousSelections:chosen,round};const r=await ask([{role:'system',content:`你正在做第${round}/5轮问题收窄。根据原始问题和前面已选择路径，生成5个具体、互不重复、能继续收窄到可执行方案的方向。只返回JSON：{"question":"本轮问题","options":["方向1","方向2","方向3","方向4","方向5"]}`},{role:'user',content:JSON.stringify(prompt)}]);const j=parse(r.text);if(!j||!Array.isArray(j.options)||j.options.length<5)throw new Error('第'+round+'轮格式异常：'+r.text.slice(0,220));const options=j.options.slice(0,5);const selected=options[(round-1)%5];rounds.push({round,question:j.question||'',options,selected,ms:r.ms});chosen.push(selected);add(`第${round}轮 ${r.ms}ms`);add('问题：'+(j.question||''));options.forEach((x,i)=>add(`${i+1}. ${x}`));add('自动选择：'+selected+'\n')}
const final=await ask([{role:'system',content:'请根据原始问题和完整5轮选择路径，直接生成约200字的可执行方案轮廓。必须具体、有行动步骤、能落地，不要解释过程，不要说无法匹配。只返回JSON：{"title":"标题","summary":"约200字方案"}'},{role:'user',content:JSON.stringify({originalQuestion:original,rounds:rounds.map(x=>({round:x.round,question:x.question,selected:x.selected}))})}]);const fj=parse(final.text);if(!fj||!fj.summary)throw new Error('最终答案格式异常：'+final.text.slice(0,300));add(`最终答案 ${final.ms}ms\n`);add('标题：'+(fj.title||'专属方案'));add('方案：'+fj.summary);const all=Math.round(performance.now()-total);status.innerHTML=`<span class="ok">完成：总耗时 ${all}ms，最终答案已生成</span>`;add(`\n总耗时：${all}ms`)}catch(e){status.innerHTML='<span class="bad">测试失败</span>';add('\n错误：'+e.message)}};
</script></body></html>
