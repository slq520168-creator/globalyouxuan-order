<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#06101d">
  <meta name="description" content="全球优选 AI 问答与会员私人资料库">
  <title>问答与资料库｜全球优选</title>
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="shop.html">
        <span class="brand-mark">GY</span>
        <span data-i18n="brand">全球优选</span>
      </a>
      <nav class="nav" aria-label="Main navigation">
        <a href="shop.html" data-i18n="navShop">方案中心</a>
        <a href="knowledge.html" aria-current="page" data-i18n="navKnowledge">问答资料库</a>
        <a href="member.html" data-i18n="navMember">会员中心</a>
      </nav>
      <div class="header-actions">
        <select class="language-select" data-language-select aria-label="Language">
          <option value="zh-CN">中文</option>
          <option value="en">English</option>
          <option value="km">ខ្មែរ</option>
        </select>
        <a id="accountLink" class="btn btn-secondary" href="login.html" data-i18n="login">登录</a>
      </div>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="shell">
        <p class="eyebrow"><span id="answerTotal">120</span>&nbsp;DATABASE</p>
        <h1 class="gradient-text" data-i18n="knowledgeTitle">问答与资料库</h1>
        <p data-i18n="knowledgeLead">浏览 4 个模块的 120 条数据库问答；登录后还可一起搜索自己的私人资料。</p>
      </div>
    </section>

    <section class="section" style="padding-top:18px">
      <div class="shell">
        <form id="knowledgeSearchForm" class="toolbar">
          <input id="knowledgeSearchInput" class="field" type="search" maxlength="180" autocomplete="off"
            data-i18n-placeholder="quickSearchPlaceholder" placeholder="例如：AI 视频、网站建设、自动回复、营销获客">
          <button class="btn" type="submit" data-i18n="search">搜索资料</button>
          <button id="clearSearchButton" class="btn btn-secondary" type="button" data-i18n="clear">清除</button>
        </form>

        <div id="knowledgeFilters" class="filter-row" role="group" aria-label="Filters">
          <button class="filter-btn active" type="button" data-filter="all" data-i18n="all">全部</button>
          <button class="filter-btn" type="button" data-filter="work">💼 <span data-i18n="catWork">AI 办公</span></button>
          <button class="filter-btn" type="button" data-filter="creation">🎨 <span data-i18n="catCreation">AI 创作</span></button>
          <button class="filter-btn" type="button" data-filter="business">🚀 <span data-i18n="catBusiness">AI 商业</span></button>
          <button class="filter-btn" type="button" data-filter="automation">⚙️ <span data-i18n="catAutomation">AI 自动化</span></button>
          <button class="filter-btn" type="button" data-filter="mine">🔒 <span data-i18n="mine">我的资料</span></button>
        </div>

        <div class="result-meta">
          <strong id="resultCount" data-i18n="loading">正在读取数据库…</strong>
          <a href="member.html#materials" class="accent" data-i18n="addMyMaterial">把缺少的资料存入我的资料库</a>
        </div>
        <div id="knowledgeMessage" class="form-message" aria-live="polite"></div>
        <div id="knowledgeList" class="knowledge-list" aria-live="polite">
          <div class="loading-card" data-i18n="loading">正在读取数据库…</div>
        </div>
        <div id="loadMoreWrap" class="load-more-wrap hidden">
          <button id="loadMoreButton" class="btn btn-secondary" type="button" data-i18n="loadMore">加载更多</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer"><div class="shell" data-i18n="footer">全球优选 · 安全会员与数字交付</div></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.0/dist/umd/supabase.js"></script>
  <script src="supabase-client.js"></script>
  <script src="i18n.js"></script>
  <script src="knowledge.js"></script>
</body>
</html>
