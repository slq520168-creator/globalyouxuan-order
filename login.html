<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#f4f8ff">
  <meta name="robots" content="noindex">
  <title>会员注册与登录｜全球优选</title>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('gyx_theme')==='dark'?'dark':'light'}catch{document.documentElement.dataset.theme='light'}</script>
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="shop.html">
        <span class="brand-mark">GY</span>
        <span data-i18n="brand">全球优选</span>
      </a>
      <nav class="nav" aria-label="Main navigation">
        <a href="shop.html" data-i18n="navShop">智能匹配</a>
        <a href="member.html" data-i18n="navMember">会员中心</a>
        <button class="nav-link-button" type="button" data-support-open data-i18n="navContact">联系客服</button>
      </nav>
      <div class="header-actions">
        <select class="language-select" data-language-select aria-label="Language">
          <option value="zh-CN">中文</option>
          <option value="en">English</option>
          <option value="km">ខ្មែរ</option>
        </select>
        <button id="themeToggle" class="icon-control" type="button" aria-label="切换主题">◐</button>
      </div>
    </div>
  </header>

  <main class="auth-main">
    <div class="shell auth-layout">
      <section class="auth-copy">
        <p class="eyebrow" data-i18n="brand">全球优选</p>
        <h1 class="gradient-text" data-i18n="authTitle">会员注册与登录</h1>
        <p data-i18n="authLead">一个账号，保存你的方案、收藏与订单。</p>
        <div class="auth-points" aria-hidden="true">
          <div class="auth-point"><span>✓</span><div data-i18n="memberLead">收藏、订单和个人资料集中管理。</div></div>
          <div class="auth-point"><span>✓</span><div data-i18n="browseKnowledge">五轮匹配后只显示一个方案</div></div>
          <div class="auth-point"><span>✓</span><div data-i18n="favoritesLead">收藏答案会保存在会员中心</div></div>
        </div>
      </section>

      <section class="auth-card">
        <div class="auth-tabs" role="tablist">
          <button id="loginTab" class="auth-tab active" type="button" role="tab" aria-selected="true" data-mode="login" data-i18n="loginTab">登录</button>
          <button id="registerTab" class="auth-tab" type="button" role="tab" aria-selected="false" data-mode="register" data-i18n="registerTab">注册</button>
        </div>

        <div id="activeSession" class="session-card">
          <div data-i18n="haveSession">这个浏览器已经登录。</div>
          <div id="sessionEmail" class="session-email"></div>
          <div class="modal-actions">
            <button id="switchAccountButton" class="btn btn-secondary" type="button" data-i18n="useAnother">切换账号</button>
            <a id="continueButton" class="btn" href="member.html" data-i18n="enterMember">进入会员中心</a>
          </div>
        </div>

        <form id="authForm" class="form-stack" novalidate>
          <div class="trap-field" aria-hidden="true">
            <label for="registerWebsite">Website</label>
            <input id="registerWebsite" type="text" tabindex="-1" autocomplete="off">
          </div>
          <div id="displayNameGroup" class="form-group hidden">
            <label for="displayName" data-i18n="displayName">会员名称</label>
            <input id="displayName" class="field" type="text" maxlength="80" autocomplete="name"
              data-i18n-placeholder="displayNamePlaceholder" placeholder="请输入会员名称">
          </div>
          <div class="form-group">
            <label for="authEmail" data-i18n="email">邮箱</label>
            <input id="authEmail" class="field" type="email" maxlength="254" autocomplete="email"
              data-i18n-placeholder="emailPlaceholder" placeholder="请输入常用邮箱" required>
          </div>
          <div id="passwordGroup" class="form-group">
            <label for="authPassword" data-i18n="password">密码</label>
            <input id="authPassword" class="field" type="password" minlength="8" maxlength="72"
              autocomplete="current-password" data-i18n-placeholder="passwordPlaceholder" placeholder="至少 8 位密码" required>
          </div>
          <div id="confirmPasswordGroup" class="form-group hidden">
            <label for="confirmPassword" data-i18n="confirmPassword">确认密码</label>
            <input id="confirmPassword" class="field" type="password" minlength="8" maxlength="72"
              autocomplete="new-password" data-i18n-placeholder="confirmPasswordPlaceholder" placeholder="再次输入密码">
          </div>
          <div id="authMessage" class="form-message" aria-live="polite"></div>
          <button id="authSubmit" class="btn btn-block" type="submit" data-i18n="signIn">登录会员账号</button>
          <div class="auth-helper-row">
            <button id="forgotPasswordButton" class="text-button" type="button" data-i18n="forgotPassword">忘记密码？</button>
            <button id="backToLoginButton" class="text-button hidden" type="button" data-i18n="backToLogin">返回登录</button>
          </div>
        </form>
      </section>
    </div>
  </main>

  <nav class="mobile-bottom-nav" aria-label="Mobile navigation">
    <a href="shop.html#matchAssistant"><span>⌕</span><b data-i18n="navShop">智能匹配</b></a>
    <a href="member.html#favorites"><span>☆</span><b data-i18n="favoritesTitle">收藏</b></a>
    <a href="shop.html" class="nav-home"><span>⌂</span><b>首页</b></a>
    <a href="member.html#orders"><span>▤</span><b data-i18n="ordersTitle">订单</b></a>
    <a href="member.html"><span>◉</span><b data-i18n="navMember">会员</b></a>
  </nav>

  <button class="support-fab" type="button" data-support-open aria-expanded="false"><span>✦</span><b data-i18n="openSupport">在线客服</b></button>
  <aside id="supportPanel" class="support-panel" aria-hidden="true" aria-labelledby="supportTitle">
    <button class="support-close" type="button" data-support-close aria-label="关闭">×</button>
    <p class="eyebrow" data-i18n="supportTitle">联系客服</p>
    <h2 id="supportTitle" data-i18n="supportLead">需要帮助？直接联系我们</h2>
    <a class="support-link telegram" href="https://t.me/qqyousubot" target="_blank" rel="noopener"><span>➤</span><div><b data-i18n="supportTelegram">Telegram客服</b><small>@qqyousubot</small></div></a>
    <a class="support-link email" href="mailto:slq520168@gmail.com"><span>✉</span><div><b data-i18n="supportEmail">邮箱客服</b><small>slq520168@gmail.com</small></div></a>
  </aside>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.0/dist/umd/supabase.js"></script>
  <script src="supabase-client.js"></script>
  <script src="i18n.js"></script>
  <script src="site-ui.js"></script>
  <script src="auth.js"></script>
</body>
</html>
