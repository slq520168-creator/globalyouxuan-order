<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f8ff">
  <meta name="robots" content="noindex">
  <title>重置密码｜全球优选</title>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('gyx_theme')==='dark'?'dark':'light'}catch{document.documentElement.dataset.theme='light'}</script>
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="shop.html"><span class="brand-mark">GY</span><span data-i18n="brand">全球优选</span></a>
      <nav class="nav" aria-label="Main navigation">
        <a href="shop.html" data-i18n="navShop">智能匹配</a>
        <a href="member.html" data-i18n="navMember">会员中心</a>
        <button class="nav-link-button" type="button" data-support-open data-i18n="navContact">联系客服</button>
      </nav>
      <div class="header-actions">
        <select class="language-select" data-language-select aria-label="Language">
          <option value="zh-CN">中文</option><option value="en">English</option><option value="km">ខ្មែរ</option>
        </select>
        <button id="themeToggle" class="icon-control" type="button" aria-label="切换主题">◐</button>
      </div>
    </div>
  </header>

  <main class="auth-main">
    <div class="shell auth-layout">
      <section class="auth-copy">
        <p class="eyebrow" data-i18n="brand">全球优选</p>
        <h1 class="gradient-text" data-i18n="resetPasswordTitle">设置新密码</h1>
        <p data-i18n="resetPasswordLead">验证链接通过后，在这里设置新密码。</p>
      </section>
      <section class="auth-card">
        <form id="resetPasswordForm" class="form-stack" novalidate>
          <div class="form-group">
            <label for="newPassword" data-i18n="newPassword">新密码</label>
            <input id="newPassword" class="field" type="password" minlength="8" maxlength="72" autocomplete="new-password" data-i18n-placeholder="passwordPlaceholder" placeholder="至少8位密码" required>
          </div>
          <div class="form-group">
            <label for="confirmNewPassword" data-i18n="confirmNewPassword">确认新密码</label>
            <input id="confirmNewPassword" class="field" type="password" minlength="8" maxlength="72" autocomplete="new-password" data-i18n-placeholder="confirmPasswordPlaceholder" placeholder="再次输入密码" required>
          </div>
          <div id="resetPasswordMessage" class="form-message show" aria-live="polite" data-i18n="checkingResetLink">正在验证重置链接…</div>
          <button id="resetPasswordSubmit" class="btn btn-block" type="submit" disabled data-i18n="saveNewPassword">保存新密码</button>
          <div class="auth-helper-row"><a class="text-button" href="login.html?mode=recover" data-i18n="requestNewResetLink">重新发送重置邮件</a></div>
        </form>
      </section>
    </div>
  </main>

  <nav class="mobile-bottom-nav" aria-label="Mobile navigation">
    <a href="shop.html"><span>⌕</span><b data-i18n="navShop">智能匹配</b></a>
    <a href="member.html#favorites"><span>☆</span><b data-i18n="favoritesTitle">我的收藏</b></a>
    <a href="member.html#orders"><span>▤</span><b data-i18n="ordersTitle">我的订单</b></a>
    <a href="member.html"><span>◉</span><b data-i18n="navMember">会员中心</b></a>
  </nav>
  <button class="support-fab" type="button" data-support-open aria-expanded="false"><span>✦</span><b data-i18n="openSupport">在线客服</b></button>
  <aside id="supportPanel" class="support-panel" aria-hidden="true" aria-labelledby="supportTitle">
    <button class="support-close" type="button" data-support-close aria-label="关闭">×</button>
    <p class="eyebrow" data-i18n="supportTitle">联系客服</p>
    <h2 id="supportTitle" data-i18n="supportLead">需要帮助？直接联系我们</h2>
    <a class="support-link telegram" href="https://t.me/qqyousubot" target="_blank" rel="noopener"><span>➤</span><div><b data-i18n="supportTelegram">Telegram客服</b><small>@qqyousubot</small></div></a>
    <a class="support-link email" href="mailto:slq520168@gmail.com"><span>✉</span><div><b data-i18n="supportEmail">邮箱客服</b><small>slq520168@gmail.com</small></div></a>
  </aside>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.0/dist/umd/supabase.js"></script>
  <script src="supabase-client.js"></script>
  <script src="i18n.js"></script>
  <script src="site-ui.js"></script>
  <script src="reset-password.js"></script>
</body>
</html>
