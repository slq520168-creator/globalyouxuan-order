<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="robots" content="noindex"><title>财富路径搜索测试</title>
<link rel="stylesheet" href="site.css">
<style>
body{background:#f4f8ff}.lab{width:min(720px,calc(100% - 24px));margin:0 auto;padding:18px 0 90px}.lab h1{font-size:28px;margin:8px 0}.lab-note{color:#6d7a8a;font-size:13px;line-height:1.6}.lab-box{background:#fff;border:1px solid #dbe6f5;border-radius:18px;padding:14px;margin-top:14px;box-shadow:0 8px 24px rgba(44,78,120,.08)}.lab-form{display:flex;gap:8px}.lab-form input{flex:1;min-width:0;border:1px solid #c9d9ef;border-radius:12px;padding:13px;font-size:16px}.lab-form button,.opt{border:0;border-radius:12px;background:#2877f3;color:white;padding:12px 14px;font-weight:700}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.chip{font-size:12px;background:#eef5ff;border:1px solid #d5e4fb;border-radius:999px;padding:5px 9px}.q{font-size:20px;line-height:1.45;margin:12px 0}.opts{display:grid;gap:8px}.opt{text-align:left;background:#fff;color:#183153;border:1px solid #cbdcf4}.opt:active{background:#eef5ff}.path{font-size:13px;line-height:1.6;color:#596a7d}.loading{padding:20px;text-align:center;color:#59708a}.final{background:#f8fbff;border:1px solid #cfe0f8;border-radius:14px;padding:13px}.final h2{font-size:20px}.final ol,.final ul{padding-left:22px;line-height:1.7}.debug summary{cursor:pointer;color:#2877f3;font-weight:700}.debug pre{white-space:pre-wrap;word-break:break-word;font-size:11px;background:#0c1724;color:#dbe8f7;padding:10px;border-radius:10px;max-height:260px;overflow:auto}
</style>
</head>
<body>
<div class="lab">
<h1>财富路径搜索·真实测试</h1>
<p class="lab-note">独立实验页，不影响正式搜索。每轮由云端AI根据你的输入与前序选择现场推演，再从当前资料库召回相关内容。页面会显示真实耗时。</p>
<div class="lab-box">
<form id="f" class="lab-form"><input id="q" maxlength="300" placeholder="输入任意词，例如：大海、葡萄、梦、白鹿" required><button type="submit">开始</button></form>
</div>
<div id="state"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.0/dist/umd/supabase.js"></script>
<script src="supabase-client.js?v=20260810-wealth-lab-1"></script>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);let query='',history=[],round=1,busy=false,lastRaw=null;const state=$('state');function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function renderLoading(){state.innerHTML='<div class="lab-box loading">正在重新匹配资料库…</div>'}async function invoke(final=false){if(busy)return;busy=true;renderLoading();try{const db=window.gyxSupabase;if(!db)throw new Error('数据库连接未初始化');const {data:{session}}=await db.auth.getSession();if(!session){state.innerHTML='<div class="lab-box">请先登录会员账号，再打开这个测试页。</div>';return}const t0=performance.now();const {data,error}=await db.functions.invoke('wealth-search-lab',{body:{query,history,round,final}});if(error)throw error;lastRaw=data;const browserMs=Math.round(performance.now()-t0);render(data,browserMs)}catch(e){state.innerHTML='<div class="lab-box">测试失败：'+esc(e.message||e)+'</div>'}finally{busy=false}}function render(d,browserMs){const final=d.final_plan;let html='<div class="lab-box"><div class="path"><b>原始输入：</b>'+esc(query)+(history.length?'<br><b>当前路径：</b>'+history.map(esc).join(' → '):'')+'</div><div class="meta"><span class="chip">第 '+esc(d.round)+' 轮</span><span class="chip">云端 '+esc(d.timing_ms)+' ms</span><span class="chip">端到端 '+browserMs+' ms</span><span class="chip">'+esc(d.stage||'动态')+'</span></div><div class="q">'+esc(d.question||'请选择最接近的一项')+'</div><div class="opts">';(d.options||[]).forEach((x,i)=>{html+='<button class="opt" type="button" data-opt="'+i+'">'+(i+1)+'. '+esc(x)+'</button>'});html+='</div></div>';if(final){html+='<div class="lab-box final"><h2>'+esc(final.title||'最终方案')+'</h2><p>'+esc(final.why||'')+'</p><p><b>增量价值：</b>'+esc(final.growth_angle||'')+'</p><h3>执行步骤</h3><ol>'+(final.steps||[]).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol><h3>收入/承接路径</h3><ul>'+(final.revenue_paths||[]).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>'}html+='<div class="lab-box debug"><details><summary>查看后台真实召回与调试数据</summary><pre>'+esc(JSON.stringify({intent:d.intent,search_terms:d.search_terms,evidence:d.evidence,engine:d.engine},null,2))+'</pre></details></div>';state.innerHTML=html;state.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{const label=d.options[Number(b.dataset.opt)];history.push(label);round=history.length+1;invoke(round>=5)})}
$('f').addEventListener('submit',e=>{e.preventDefault();query=$('q').value.trim();if(!query)return;history=[];round=1;invoke(false)});
})();
</script>
</body></html>
