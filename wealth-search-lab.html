<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="robots" content="noindex"><title>财富路径搜索测试</title>
<link rel="stylesheet" href="site.css">
<style>
body{background:#f4f8ff}.lab{width:min(720px,calc(100% - 24px));margin:0 auto;padding:18px 0 90px}.lab h1{font-size:28px;margin:8px 0}.lab-note{color:#6d7a8a;font-size:13px;line-height:1.6}.lab-box{background:#fff;border:1px solid #dbe6f5;border-radius:18px;padding:14px;margin-top:14px;box-shadow:0 8px 24px rgba(44,78,120,.08)}.lab-form{display:flex;gap:8px}.lab-form input{flex:1;min-width:0;border:1px solid #c9d9ef;border-radius:12px;padding:13px;font-size:16px}.lab-form button,.opt{border:0;border-radius:12px;background:#2877f3;color:white;padding:12px 14px;font-weight:700}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.chip{font-size:12px;background:#eef5ff;border:1px solid #d5e4fb;border-radius:999px;padding:5px 9px}.q{font-size:20px;line-height:1.45;margin:12px 0}.opts{display:grid;gap:8px}.opt{text-align:left;background:#fff;color:#183153;border:1px solid #cbdcf4}.opt:active{background:#eef5ff}.path{font-size:13px;line-height:1.6;color:#596a7d}.loading{padding:20px;text-align:center;color:#59708a}.final{background:#f8fbff;border:1px solid #cfe0f8;border-radius:14px;padding:13px}.final h2{font-size:20px}.debug{margin-top:36px;opacity:.72}.debug summary{cursor:pointer;color:#55708f;font-size:12px}.debug pre{white-space:pre-wrap;word-break:break-word;font-size:10px;background:#0c1724;color:#dbe8f7;padding:10px;border-radius:10px;max-height:240px;overflow:auto}.error{color:#9f1d1d;line-height:1.65}.stage-title{font-size:13px;color:#5d7188;margin-top:4px}.progress{display:flex;gap:6px;margin:10px 0 2px}.dot{height:6px;flex:1;border-radius:999px;background:#dfe9f7}.dot.on{background:#2877f3}
</style>
</head>
<body>
<div class="lab">
<h1>财富路径搜索·真实测试</h1>
<p class="lab-note">独立实验页，不影响正式首页。任意合法输入由云端AI理解，结合内部资料库能力逐轮收窄，第5轮形成可执行方案。</p>
<div class="lab-box"><form id="f" class="lab-form"><input id="q" maxlength="300" placeholder="输入任意词，例如：大海、葡萄、梦、白鹿" required><button type="submit">开始</button></form></div>
<div id="state"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.0/dist/umd/supabase.js"></script>
<script src="supabase-client.js?v=20260810-wealth-lab-3"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);let query='',history=[],round=1,busy=false;const state=$('state');
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderLoading(){state.innerHTML='<div class="lab-box loading">正在生成第 '+round+' 轮结果…</div>'}
async function callEdge(body){const db=window.gyxSupabase,cfg=window.GYX_CONFIG;if(!db||!cfg)throw new Error('Supabase连接未初始化');const {data:{session},error}=await db.auth.getSession();if(error)throw error;if(!session)throw new Error('请先登录会员账号，再打开这个测试页。');const res=await fetch(cfg.url+'/functions/v1/wealth-search-lab',{method:'POST',headers:{'content-type':'application/json','apikey':cfg.publishableKey,'authorization':'Bearer '+session.access_token},body:JSON.stringify(body)});let payload=null,text='';try{text=await res.text();payload=text?JSON.parse(text):null}catch{}if(!res.ok)throw new Error('Edge Function HTTP '+res.status+'：'+(payload?.message||payload?.error||text||'请求失败'));if(!payload)throw new Error('Edge Function返回空数据');return payload}
async function invoke(){if(busy)return;busy=true;renderLoading();try{const t0=performance.now(),d=await callEdge({query,history,round});render(d,Math.round(performance.now()-t0))}catch(e){state.innerHTML='<div class="lab-box error"><b>测试失败</b><br>'+esc(e.message||e)+'</div>'}finally{busy=false}}
function render(d,browserMs){const final=d.final_plan;const stage=d.stage||'动态推演';let html='<div class="lab-box"><div class="path"><b>原始输入：</b>'+esc(query)+(history.length?'<br><b>当前路径：</b>'+history.map(esc).join(' → '):'')+'</div><div class="progress">'+[1,2,3,4,5].map(i=>'<span class="dot '+(i<=Number(d.round||round)?'on':'')+'"></span>').join('')+'</div><div class="meta"><span class="chip">第 '+esc(d.round)+' 轮</span><span class="chip">端到端 '+browserMs+' ms</span></div><div class="stage-title">'+esc(stage)+'</div><div class="q">'+esc(d.question||'请选择最接近的一项')+'</div><div class="opts">';(d.options||[]).forEach((x,i)=>html+='<button class="opt" type="button" data-opt="'+i+'">'+(i+1)+'. '+esc(x)+'</button>');html+='</div></div>';
if(final){const text=typeof final==='string'?final:(final.text||'');html+='<div class="lab-box final"><h2>最终执行方案</h2><div style="white-space:pre-wrap;line-height:1.75">'+esc(text)+'</div></div>'}
html+='<div class="lab-box debug"><details><summary>开发调试数据</summary><pre>'+esc(JSON.stringify({timing_ms:d.timing_ms,intent:d.intent,search_terms:d.search_terms,evidence:d.evidence,engine:d.engine},null,2))+'</pre></details></div>';state.innerHTML=html;state.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{history.push(d.options[Number(b.dataset.opt)]);round=history.length+1;invoke()})}
$('f').addEventListener('submit',e=>{e.preventDefault();query=$('q').value.trim();if(!query)return;history=[];round=1;invoke()});
})();
</script>
</body></html>
