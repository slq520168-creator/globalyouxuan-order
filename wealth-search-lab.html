<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="robots" content="noindex"><title>财富路径搜索测试</title>
<link rel="stylesheet" href="site.css">
<style>
body{background:#f4f8ff}.lab{width:min(720px,calc(100% - 24px));margin:0 auto;padding:18px 0 90px}.lab h1{font-size:28px;margin:8px 0}.lab-note{color:#6d7a8a;font-size:13px;line-height:1.6}.lab-box{background:#fff;border:1px solid #dbe6f5;border-radius:18px;padding:14px;margin-top:14px;box-shadow:0 8px 24px rgba(44,78,120,.08)}.lab-form{display:flex;gap:8px}.lab-form input{flex:1;min-width:0;border:1px solid #c9d9ef;border-radius:12px;padding:13px;font-size:16px}.lab-form button,.opt{border:0;border-radius:12px;background:#2877f3;color:white;padding:12px 14px;font-weight:700}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.chip{font-size:12px;background:#eef5ff;border:1px solid #d5e4fb;border-radius:999px;padding:5px 9px}.q{font-size:20px;line-height:1.45;margin:12px 0}.opts{display:grid;gap:8px}.opt{text-align:left;background:#fff;color:#183153;border:1px solid #cbdcf4}.opt:active{background:#eef5ff}.path{font-size:13px;line-height:1.6;color:#596a7d}.loading{padding:20px;text-align:center;color:#59708a}.final{background:#f8fbff;border:1px solid #cfe0f8;border-radius:14px;padding:13px}.final h2{font-size:20px}.final ol,.final ul{padding-left:22px;line-height:1.7}.debug summary{cursor:pointer;color:#2877f3;font-weight:700}.debug pre{white-space:pre-wrap;word-break:break-word;font-size:11px;background:#0c1724;color:#dbe8f7;padding:10px;border-radius:10px;max-height:300px;overflow:auto}.error{color:#9f1d1d;line-height:1.65}.sub{font-size:13px;color:#64758a;line-height:1.65}
</style>
</head>
<body>
<div class="lab">
<h1>财富路径搜索·真实测试</h1>
<p class="lab-note">独立实验页，不影响正式首页。任意合法输入先由云端AI动态理解与发散，再真实召回Supabase资料库；每轮给出5个不同方向，选择后继续收窄，第5轮才形成可执行方案。</p>
<div class="lab-box">
<form id="f" class="lab-form"><input id="q" maxlength="300" placeholder="输入任意词，例如：大海、葡萄、梦、白鹿" required><button type="submit">开始</button></form>
</div>
<div id="state"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.0/dist/umd/supabase.js"></script>
<script src="supabase-client.js?v=20260810-wealth-lab-2"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);let query='',history=[],round=1,busy=false,lastRaw=null;const state=$('state');
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderLoading(){state.innerHTML='<div class="lab-box loading">AI正在理解 → 召回资料库 → 动态推演…</div>'}
async function callEdge(body){
  const db=window.gyxSupabase,cfg=window.GYX_CONFIG;if(!db||!cfg)throw new Error('Supabase连接未初始化');
  const {data:{session},error:sessionError}=await db.auth.getSession();if(sessionError)throw sessionError;
  if(!session)throw new Error('请先登录会员账号，再打开这个测试页。');
  const endpoint=cfg.url+'/functions/v1/wealth-search-lab';
  let res;
  try{res=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json','apikey':cfg.publishableKey,'authorization':'Bearer '+session.access_token},body:JSON.stringify(body)})}
  catch(e){throw new Error('网络无法连接Edge Function：'+(e.message||e))}
  let payload=null,text='';try{text=await res.text();payload=text?JSON.parse(text):null}catch(e){}
  if(!res.ok){const detail=payload?.message||payload?.error||text||('HTTP '+res.status);throw new Error('Edge Function HTTP '+res.status+'：'+detail)}
  if(!payload)throw new Error('Edge Function返回空数据');return payload;
}
async function invoke(){if(busy)return;busy=true;renderLoading();try{const t0=performance.now();const data=await callEdge({query,history,round});lastRaw=data;const browserMs=Math.round(performance.now()-t0);render(data,browserMs)}catch(e){state.innerHTML='<div class="lab-box error"><b>测试失败</b><br>'+esc(e.message||e)+'</div>'}finally{busy=false}}
function render(d,browserMs){
  const final=d.final_plan;let html='<div class="lab-box"><div class="path"><b>原始输入：</b>'+esc(query)+(history.length?'<br><b>当前路径：</b>'+history.map(esc).join(' → '):'')+'</div><div class="meta"><span class="chip">第 '+esc(d.round)+' 轮</span><span class="chip">云端 '+esc(d.timing_ms)+' ms</span><span class="chip">端到端 '+browserMs+' ms</span><span class="chip">'+esc(d.stage||'动态')+'</span><span class="chip">召回 '+esc(d.engine?.library_rows??0)+' 条</span></div><div class="q">'+esc(d.question||'请选择最接近的一项')+'</div><div class="opts">';
  (d.options||[]).forEach((x,i)=>{html+='<button class="opt" type="button" data-opt="'+i+'">'+(i+1)+'. '+esc(x)+'</button>'});html+='</div></div>';
  if(final){html+='<div class="lab-box final"><h2>'+esc(final.title||'最终方案')+'</h2><p>'+esc(final.why||'')+'</p><p><b>增量价值：</b>'+esc(final.growth_angle||'')+'</p><h3>执行步骤</h3><ol>'+(final.steps||[]).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol><h3>收入/承接路径</h3><ul>'+(final.revenue_paths||[]).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'+(final.first_test?'<h3>首个验证动作</h3><p>'+esc(final.first_test)+'</p>':'')+(final.tools?.length?'<h3>需要的工具/资源</h3><ul>'+final.tools.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'')+(final.risks?.length?'<h3>风险与失败信号</h3><ul>'+final.risks.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'')+'</div>'}
  html+='<div class="lab-box debug"><details><summary>查看后台真实召回与调试数据</summary><pre>'+esc(JSON.stringify({intent:d.intent,search_terms:d.search_terms,evidence:d.evidence,engine:d.engine},null,2))+'</pre></details></div>';state.innerHTML=html;
  state.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{const label=d.options[Number(b.dataset.opt)];history.push(label);round=history.length+1;invoke()})
}
$('f').addEventListener('submit',e=>{e.preventDefault();query=$('q').value.trim();if(!query)return;history=[];round=1;invoke()});
})();
</script>
</body></html>
