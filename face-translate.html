<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f4f8ff">
<title>GlobalYouXuan</title>
<script>try{var t=localStorage.getItem('gyx_theme')==='dark'?'dark':'light';document.documentElement.dataset.theme=t;var m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='dark'?'#06101d':'#f4f8ff'}catch{document.documentElement.dataset.theme='light'}</script>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://afzcohtnljnmucrkgcaz.supabase.co" crossorigin>
<link rel="stylesheet" href="site.css">
<style>
body.ft-page{background:var(--bg,#f4f8ff);color:var(--text,#142033);-webkit-tap-highlight-color:transparent}
.ft-main{padding:14px 0 110px}.ft-shell{width:min(100% - 20px,760px);margin:0 auto}
.ft-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.ft-head h1{margin:0;font-size:24px;font-weight:950}
.ft-back{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:38px;padding:0 12px;border:1px solid var(--line,#dbe5f1);border-radius:12px;background:var(--panel,#fff);color:inherit;font-size:13px;font-weight:800;text-decoration:none}
.ft-langbar{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:14px}
.ft-langsel{min-height:46px;padding:0 12px;border:1px solid var(--line,#dbe5f1);border-radius:14px;background:var(--panel,#fff);color:inherit;font-size:15px;font-weight:800;appearance:none;-webkit-appearance:none;text-align:center}
.ft-swap{width:46px;height:46px;border:1px solid rgba(31,103,180,.22);border-radius:50%;background:rgba(40,119,243,.08);color:#2877f3;font-size:20px;font-weight:900;cursor:pointer}
.ft-talk{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ft-side{display:grid;gap:10px;padding:14px;border:1px solid var(--line,#dbe5f1);border-radius:20px;background:var(--panel,#fff);box-shadow:0 5px 18px rgba(31,70,120,.06);align-content:start}
.ft-side[data-side="b"]{border-color:rgba(41,179,109,.25)}
.ft-side-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ft-side-title{font-size:15px;font-weight:950}
.ft-state{font-size:11px;font-weight:800;color:#6b7485}
.ft-state.rec{color:#e53935}
.ft-log{display:grid;gap:8px;min-height:150px;max-height:44vh;overflow:auto;-webkit-overflow-scrolling:touch}
.ft-msg{display:grid;gap:5px;padding:10px 12px;border-radius:14px;background:rgba(40,119,243,.06);border:1px solid rgba(40,119,243,.10)}
.ft-side[data-side="b"] .ft-msg{background:rgba(41,179,109,.07);border-color:rgba(41,179,109,.14)}
.ft-msg-src{font-size:16px;line-height:1.55;font-weight:700;word-break:break-word}
.ft-msg-dst{font-size:15px;line-height:1.6;color:#43536b;word-break:break-word}
.ft-msg-meta{display:flex;align-items:center;gap:8px;font-size:11px;color:#8a97a8}
.ft-speak{border:0;background:transparent;color:#2877f3;font-size:11px;font-weight:900;padding:2px 4px;cursor:pointer}
.ft-side[data-side="b"] .ft-speak{color:#17834c}
.ft-input{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}
.ft-input textarea{min-height:48px;max-height:120px;resize:none;border:1px solid var(--line,#dbe5f1);border-radius:14px;padding:11px 12px;font-size:15px;background:var(--panel-strong,#fff);color:inherit;box-sizing:border-box}
.ft-mic{width:56px;height:56px;border:0;border-radius:50%;background:#2877f3;color:#fff;font-size:24px;cursor:pointer;box-shadow:0 8px 22px rgba(40,119,243,.30);transition:transform .12s ease}
.ft-side[data-side="b"] .ft-mic{background:#29b36d;box-shadow:0 8px 22px rgba(41,179,109,.30)}
.ft-mic.rec{transform:scale(1.08);animation:ft-pulse 1.1s ease infinite}
@keyframes ft-pulse{0%,100%{box-shadow:0 0 0 0 rgba(229,57,53,.35)}50%{box-shadow:0 0 0 14px rgba(229,57,53,0)}}
.ft-mic.rec{background:#e53935}
.ft-hint{font-size:11px;color:#8a97a8;line-height:1.5}
.ft-toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);transform:translateX(-50%);padding:10px 16px;border-radius:12px;background:#172033;color:#fff;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:50;max-width:min(90vw,420px);text-align:center}
.ft-toast.show{opacity:.96}
html[data-theme="dark"] body.ft-page{background:#06101d;color:#f3f8fc}
html[data-theme="dark"] .ft-back,html[data-theme="dark"] .ft-langsel{background:rgba(12,24,42,.96);border-color:rgba(168,207,231,.15);color:#f3f8fc}
html[data-theme="dark"] .ft-side{background:rgba(12,24,42,.96);border-color:rgba(168,207,231,.15)}
html[data-theme="dark"] .ft-msg{background:rgba(40,119,243,.12);border-color:rgba(130,170,220,.16)}
html[data-theme="dark"] .ft-side[data-side="b"] .ft-msg{background:rgba(41,179,109,.12);border-color:rgba(41,179,109,.2)}
html[data-theme="dark"] .ft-msg-dst{color:#c3d2e4}
html[data-theme="dark"] .ft-input textarea{background:rgba(8,18,34,.92);border-color:rgba(168,207,231,.15);color:#e8eef7}
@media(max-width:640px){.ft-talk{grid-template-columns:1fr;gap:10px}.ft-side{padding:12px}.ft-log{max-height:34vh;min-height:110px}}
</style>
</head>
<body class="ft-page">
<main class="ft-main">
  <div class="ft-shell">
    <div class="ft-head"><h1 data-i18n="ftTitle"></h1><a class="ft-back" href="free-zone.html" data-i18n="back"></a></div>
    <div class="ft-langbar">
      <select id="langA" class="ft-langsel" data-i18n-aria="ftLanguage"></select>
      <button id="swapBtn" class="ft-swap" type="button" data-i18n-aria="ftSwap">⇄</button>
      <select id="langB" class="ft-langsel" data-i18n-aria="ftLanguage"></select>
    </div>
    <div class="ft-talk">
      <section class="ft-side" data-side="a">
        <div class="ft-side-head"><span class="ft-side-title" id="titleA">—</span><span class="ft-state" id="stateA"></span></div>
        <div class="ft-log" id="logA"></div>
        <form class="ft-input" id="formA"><textarea id="inputA" rows="1"></textarea><button class="ft-mic" id="micA" type="button" data-i18n-aria="ftTalk">🎙</button></form>
        <div class="ft-hint" id="hintA"></div>
      </section>
      <section class="ft-side" data-side="b">
        <div class="ft-side-head"><span class="ft-side-title" id="titleB">—</span><span class="ft-state" id="stateB"></span></div>
        <div class="ft-log" id="logB"></div>
        <form class="ft-input" id="formB"><textarea id="inputB" rows="1"></textarea><button class="ft-mic" id="micB" type="button" data-i18n-aria="ftTalk">🎙</button></form>
        <div class="ft-hint" id="hintB"></div>
      </section>
    </div>
  </div>
</main>
<div id="ftToast" class="ft-toast" role="status" aria-live="polite"></div>
