<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="robots" content="noindex"><title>财富匹配实验室</title><link rel="stylesheet" href="site.css"><style>body{background:#f4f8ff}.lab{width:min(760px,calc(100% - 24px));margin:0 auto;padding:20px 0 100px}.lab h1{font-size:28px;margin:12px 0 6px}.lab p{color:#6f7f90}.lab-card{background:#fff;border:1px solid #dce8f8;border-radius:20px;padding:16px;margin-top:14px;box-shadow:0 10px 28px rgba(39,76,130,.08)}.lab-search{display:flex;gap:8px}.lab-search input{flex:1;min-width:0;padding:14px;border:1px solid #c9d9ef;border-radius:14px;font-size:16px}.lab-search button,.choice{border:0;border-radius:14px;background:#2877f3;color:#fff;padding:13px 14px;font-weight:700}.choice{display:block;width:100%;text-align:left;margin:9px 0;background:#eef5ff;color:#1f5fbf;border:1px solid #cbdcf7}.choice b{display:block;color:#153c70;margin-bottom:3px}.small{font-size:12px;color:#7c8b9b}.typing{min-height:26px;font-weight:700;color:#2d5f9f}.hidden{display:none!important}.result h2{margin:4px 0 8px}.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef5ff;margin:3px;font-size:12px}.path{padding-left:20px}.danger{color:#c62828}.debug{font-size:12px;white-space:pre-wrap;background:#0b1420;color:#bde1ff;padding:10px;border-radius:12px;max-height:180px;overflow:auto}</style></head><body><main class="lab"><h1>财富匹配实验室</h1><p>独立测试页，不影响正式搜索。输入任意词，系统每轮重新从资料库计算。</p><section class="lab-card"><form id="f" class="lab-search"><input id="q" data-user-content placeholder="例如：大海、特朗普、梦、学生、咖啡" autocomplete="off"><button>开始</button></form><div id="msg" class="small"></div></section><section id="quiz" class="lab-card hidden"><div id="step" class="small"></div><div id="typing" class="typing"></div><div id="choices"></div></section><section id="result" class="lab-card result hidden"><div class="small">最终方案候选</div><h2 id="rt"></h2><p id="rs"></p><div id="tags"></div><h3>本次路径</h3><ol id="path" class="path"></ol><details><summary>查看后台检索信息</summary><div id="debug" class="debug" data-no-i18n></div></details></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.0/dist/umd/supabase.js"></script><script src="supabase-client.js"></script><script src="i18n.js"></script><script src="global-locale.js?v=20260811-global-auto-1"></script><script src="search-lab.js?v=1"></script></body></html>
